<!doctype html>
<html lang="ht">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ekip · Atelye konferans</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/icon.png">
<link rel="stylesheet" href="/style.css">
<style>
  body { background: var(--soft); }
  main { max-width: 980px; margin: 0 auto; padding: 18px 16px 60px; }
  .tabs3 { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 16px; }
  .tabs3 button { flex: none; border: 0; padding: 10px 14px; border-radius: 999px; background: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  .tabs3 button[aria-selected="true"] { background: #0f0f0f; color: #fff; }
  .kpi { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .kpi div { background: #fff; border-radius: 14px; padding: 14px 16px; }
  .kpi small { color: var(--mute); font-weight: 600; } .kpi b { display: block; font-size: 28px; letter-spacing: -0.02em; }
  .row2 { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .kv2 { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 14px; margin: 10px 0; }
  .kv2 dt { color: var(--mute); } .kv2 dd { margin: 0; word-break: break-word; }
  .act2 { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .bad { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 6px; background: var(--soft); }
  .bad.valide { background: #e7f4ec; color: var(--ok); } .bad.refuse, .bad.annule, .bad.rembourse { background: #fdecea; color: var(--bad); }
  .bad.en_attente { background: #fff1d6; color: #8a5a00; } .bad.utilise { background: #e7f0fd; color: #1d4ed8; }
  .bars { display: flex; align-items: flex-end; gap: 4px; height: 120px; background: #fff; border-radius: 14px; padding: 12px; overflow-x: auto; }
  .bars i { flex: 1 0 14px; background: #ffc83d; border-radius: 4px 4px 0 0; position: relative; }
  .kapti { max-width: 100%; border-radius: 10px; margin-top: 8px; display: block; }
  label.l { display: block; font-weight: 600; font-size: 14px; margin: 12px 0 6px; }
  select { width: 100%; font: inherit; font-size: 16px; padding: 12px 14px; border: 0; border-radius: 10px; background: var(--soft); }
  .tp2 { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 1.6fr; gap: 6px; margin-bottom: 8px; }
  .tp2 input, .tp2 textarea { padding: 10px; font-size: 14px; }
  .tp2 { padding-bottom: 12px; border-bottom: 1px solid var(--line); }
  @media (max-width: 700px) { .tp2 { grid-template-columns: 1fr 1fr; } }
  .srch { margin-bottom: 10px; }
  .fot { display: flex; align-items: center; gap: 12px; }
  .fot span, .ek .av { flex: none; width: 64px; height: 64px; border-radius: 50%; background: #eee center/cover no-repeat; display: grid; place-items: center; font-weight: 800; color: #aaa; }
  .ek { display: flex; gap: 12px; align-items: flex-start; } .ek > div { flex: 1; min-width: 0; }
  .ek textarea, .mw textarea { width: 100%; font: inherit; border: 0; border-radius: 10px; background: var(--soft); padding: 10px; }
  .mw ul { margin: 6px 0 0; padding-left: 18px; } .mw li { margin: 3px 0; }
  .mw .tr { white-space: pre-wrap; background: var(--soft); border-radius: 10px; padding: 10px; }
  .alrt { background: #fff1d6; color: #8a5a00; border-radius: 12px; padding: 12px; font-weight: 600; margin-bottom: 12px; }
  .done { white-space: pre-wrap; font-size: 14px; background: var(--soft); border-radius: 10px; padding: 10px; }
</style>
</head>
<body>
<header class="top"><div class="wrap"><a href="/konferans" aria-label="Atelye AI"><img src="/logo.png" alt="Atelye AI"></a><nav><span class="mute small" id="moun"></span><button class="btn sm light hidden" id="soti" type="button">Soti</button></nav></div></header>
<main>
  <div id="login" class="card" style="max-width:440px;margin:30px auto">
    <h2 style="margin-top:0">Espas ekip la</h2>
    <nav class="tabs3" id="lt"><button type="button" data-m="k" aria-selected="true">Konekte</button><button type="button" data-m="e" aria-selected="false">Kreye kont</button></nav>
    <form id="fk">
      <label class="l" for="li">Nimewo WhatsApp oswa Gmail</label><input id="li" autocomplete="username" required>
      <label class="l" for="lm">Modpas</label><input id="lm" type="password" autocomplete="current-password" required>
      <div class="msg hidden"></div><button class="btn full" style="margin-top:14px">Antre</button>
      <p class="mute small" style="text-align:center;margin:12px 0 0"><a href="#" id="akod">Mwen gen yon kòd ekip</a></p>
    </form>
    <form id="fkod" class="hidden">
      <label class="l" for="kod">Kòd ekip</label><input id="kod" type="password" autocomplete="current-password" required>
      <div class="msg hidden"></div><button class="btn full" style="margin-top:14px">Antre ak kòd la</button>
    </form>
    <form id="fe" class="hidden">
      <p class="mute small" style="margin:0">Kreye kont ou. Super admin lan ap valide l epi ba w wòl ou.</p>
      <label class="l" for="en">Non konplè</label><input id="en" autocomplete="name" required>
      <label class="l" for="ei">Nimewo WhatsApp oswa Gmail</label><input id="ei" autocomplete="username" required>
      <label class="l" for="em">Modpas (omwen 8 karaktè)</label><input id="em" type="password" autocomplete="new-password" minlength="8" required>
      <label class="l">Foto w (pou badj la)</label>
      <div class="fot"><span id="fp"></span><label class="btn sm light" for="ef">📷 Pran yon foto</label><input id="ef" type="file" accept="image/*" capture="user" class="hidden"></div>
      <div class="msg hidden"></div><button class="btn full" style="margin-top:14px">Voye demann lan</button>
    </form>
  </div>

  <div id="app" class="hidden">
    <div class="row2"><h2 style="margin:0" id="evt">—</h2><span class="mute small" id="mizajou"></span></div>
    <nav class="tabs3" id="tabs"></nav>
    <section id="v"></section>
  </div>
</main>
<script src="/vendor/qrcode.js"></script>
<script src="/sb.js"></script>
<script src="/badj.js"></script>
<script>
(() => {
  const $ = (q) => document.querySelector(q);
  const el = (t, p = {}, ...c) => { const e = Object.assign(document.createElement(t), p); e.append(...c.filter((x) => x != null)); return e; };
  let KOD = "", D = null, ME = null, TAB = "file", FILT = "", VI = false;
  try { KOD = localStorage.getItem("staf-kod") || sessionStorage.getItem("staf-kod") || ""; } catch {}
  const site = location.origin;
  const tel = (t) => { const d = String(t || "").replace(/\D/g, ""); return d.length === 8 ? "509" + d : d; };
  const wa = (t, msg) => `https://wa.me/${tel(t)}?text=${encodeURIComponent(msg)}`;
  const premye = (n) => String(n || "").split(" ")[0];
  const msgTike = (x, code) => `Bonjou ${premye(x.nom)}! 🎉 Peman w lan valide. Men tikè w pou atelye konferans Atelye AI a (${x.code_court}):\n${site}/billet/${code}\n\nSamdi 28 novanm, 10h, Lise Anacaona, Leyogàn. Montre kòd QR a nan pòt la.`;
  const msgRefi = (x, motif) => `Bonjou ${premye(x.nom)}. Se Atelye AI. Nou pa t ka valide peman pou enskripsyon ${x.code_court}: ${motif}. Reponn mesaj sa a pou n regle sa ansanm.`;

  async function chaje() {
    ME = await SB.rpc("staf_mwen", { p_code: KOD });
    D = ME.role === "scanneur" ? { role: "scanneur", non: ME.non, evenement: ME.evenement, file: [], lis: [], types: [] } : await SB.rpc("staf_tablo", { p_code: KOD });
    $("#evt").textContent = D.evenement ? D.evenement.nom : "Pa gen evènman";
    $("#moun").textContent = `${D.non} · ${D.role}`;
    $("#mizajou").textContent = "Mizajou " + new Date().toLocaleTimeString("fr-HT", { hour: "2-digit", minute: "2-digit" });
    const T = D.role === "admin"
      ? [["file", `Validasyon (${D.file.length})`], ["tablo", "Chif"], ["lis", "Enskripsyon"], ["kach", "Enskri yon moun"], ["rapel", "Rapèl"], ["ekip", "Ekip"], ["param", "Paramèt"], ["mwen", "Espas mwen"]]
      : D.role === "vandeur" ? [["kach", "Enskri yon moun"], ["lis", "Jwenn yon tikè"], ["mwen", "Espas mwen"]]
      : D.role === "scanneur" ? [["mwen", "Espas mwen"]]
      : [["file", `Validasyon (${D.file.length})`], ["mwen", "Espas mwen"]];
    if (!ME.foto && !VI) TAB = "mwen";   // first screen asks for the badge photo
    VI = true;
    if (!T.some(([k]) => k === TAB)) TAB = T[0][0];
    $("#tabs").replaceChildren(...T.map(([k, t]) => { const b = el("button", { type: "button", textContent: t }); b.dataset.k = k; b.setAttribute("aria-selected", String(k === TAB)); b.onclick = () => { TAB = k; afiche(); chaje().catch(() => {}); }; return b; }));
    afiche();
  }
  async function antre(k) {
    KOD = k; await SB.rpc("staf_konekte", { p_code: KOD });
    try { localStorage.setItem("staf-kod", KOD); } catch {}
    $("#login").classList.add("hidden"); $("#app").classList.remove("hidden"); $("#soti").classList.remove("hidden");
    await chaje(); setInterval(() => chaje().catch(() => {}), 60000);
  }
  const erè = (f, e) => { const m = f.querySelector(".msg"); m.className = "msg err"; m.textContent = e.message; };
  // login screen: number/Gmail + password, old team code, or a new account waiting for approval
  $("#lt").onclick = (ev) => { const m = ev.target.dataset.m; if (!m) return;
    $("#lt").querySelectorAll("button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.m === m)));
    $("#fk").classList.toggle("hidden", m !== "k"); $("#fkod").classList.add("hidden"); $("#fe").classList.toggle("hidden", m !== "e"); };
  $("#akod").onclick = (ev) => { ev.preventDefault(); $("#fk").classList.add("hidden"); $("#fkod").classList.remove("hidden"); };
  $("#fk").onsubmit = async (ev) => { ev.preventDefault(); const f = ev.target; f.querySelector(".msg").className = "msg hidden";
    try { const r = await SB.rpc("staf_login", { p_idantifyan: $("#li").value, p_modpas: $("#lm").value }); await antre(r.token); } catch (e) { erè(f, e); } };
  $("#fkod").onsubmit = (ev) => { ev.preventDefault(); antre($("#kod").value).catch((e) => erè(ev.target, e)); };
  // phone photos are big: square crop, 480 px JPEG
  const foto = (file) => new Promise((ok, ko) => { const i = new Image(); i.onload = () => {
      const s = Math.min(i.width, i.height), c = document.createElement("canvas"); c.width = c.height = 480;
      c.getContext("2d").drawImage(i, (i.width - s) / 2, (i.height - s) / 2, s, s, 0, 0, 480, 480);
      ok(c.toDataURL("image/jpeg", 0.8).split(",")[1]); URL.revokeObjectURL(i.src); };
    i.onerror = () => ko(new Error("Nou pa ka li foto sa a.")); i.src = URL.createObjectURL(file); });
  let FOTO = null;
  $("#ef").onchange = async () => { const f = $("#ef").files[0]; if (!f) return; FOTO = await foto(f); $("#fp").style.backgroundImage = `url(data:image/jpeg;base64,${FOTO})`; };
  $("#fe").onsubmit = async (ev) => { ev.preventDefault(); const f = ev.target, m = f.querySelector(".msg"); m.className = "msg hidden";
    if (!FOTO) return erè(f, new Error("Pran yon foto w pou badj la."));
    try { await SB.rpc("staf_enskri", { p_non: $("#en").value, p_idantifyan: $("#ei").value, p_modpas: $("#em").value, p_foto: FOTO });
      f.reset(); FOTO = null; $("#fp").style.backgroundImage = ""; m.className = "msg ok"; m.textContent = "Demann lan voye ✓ Super admin lan ap valide kont ou. Apre sa, konekte ak nimewo/Gmail ou ak modpas ou."; }
    catch (e) { erè(f, e); } };
  $("#soti").onclick = async () => { try { await SB.rpc("staf_soti", { p_code: KOD }); } catch {} try { localStorage.removeItem("staf-kod"); sessionStorage.removeItem("staf-kod"); } catch {} location.reload(); };
  if (KOD) antre(KOD).catch(() => { try { localStorage.removeItem("staf-kod"); sessionStorage.removeItem("staf-kod"); } catch {} });

  const bouton = (t, f, light) => { const b = el("button", { type: "button", className: "btn sm" + (light ? " light" : ""), textContent: t }); b.onclick = async () => { b.disabled = true; try { await f(b); } catch (e) { alert(e.message); } b.disabled = false; }; return b; };
  const lyen = (t, href) => el("a", { className: "btn sm light", href, target: "_blank", rel: "noopener", textContent: t });

  function afiche() {
    document.querySelectorAll("#tabs button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.k === TAB)));
    const v = $("#v"); v.replaceChildren();
    if (!D.evenement && TAB !== "mwen" && TAB !== "ekip") { v.append(el("p", { className: "mute", textContent: "Kreye evènman an nan Paramèt." })); if (TAB !== "param") return; }
    ({ file: vFile, tablo: vTablo, lis: vLis, kach: vKach, rapel: vRapel, param: vParam, ekip: vEkip, mwen: vMwen }[TAB] || vFile)(v);
  }

  // ---- validation queue: oldest first
  function vFile(v) {
    if (!D.file.length) { v.append(el("p", { className: "mute", textContent: "Pa gen peman k ap tann. ✓" })); return; }
    v.append(el("p", { className: "mute small", textContent: "Pi ansyen an anlè. Konpare ak istorik MonCash/NatCash la anvan w valide." }));
    D.file.forEach((x) => {
      const kv = el("dl", { className: "kv2" });
      [["Kòd", x.code_court], ["WhatsApp", x.telephone], ["Tikè", x.type], ["Montan", SB.goud(x.montant)], ["Peman", (x.moyen || "").toUpperCase() + " · " + x.reference], ["Voye", SB.dat(x.soumis_le, { dateStyle: "short", timeStyle: "short" })]]
        .forEach(([k, val]) => kv.append(el("dt", { textContent: k }), el("dd", { textContent: val })));
      const kat = el("div", { className: "card" }, el("div", { className: "row2" }, el("h3", { style: "margin:0", textContent: x.nom }), el("span", { className: "bad en_attente", textContent: "An atant" })), kv);
      const a = el("div", { className: "act2" });
      a.append(bouton("Peman an rive — Valide", async () => {
        const r = await SB.rpc("staf_valide", { p_code: KOD, p_id: x.id });
        window.open(wa(x.telephone, msgTike(x, r.billet)), "_blank"); await chaje();
      }));
      a.append(bouton("Refize", async () => {
        const motif = prompt("Poukisa? (moun nan ap wè rezon sa a)"); if (!motif) return;
        await SB.rpc("staf_refize", { p_code: KOD, p_id: x.id, p_motif: motif });
        window.open(wa(x.telephone, msgRefi(x, motif)), "_blank"); await chaje();
      }, true));
      if (x.capture) a.append(bouton("Wè kapti a", async (b) => {
        const c = await SB.rpc("staf_kapti", { p_code: KOD, p_id: x.id }); if (!c) return;
        b.replaceWith(el("img", { className: "kapti", src: `data:${c.type};base64,${c.data}`, alt: "Kapti peman" }));
      }, true));
      kat.append(a); v.append(kat);
    });
  }

  // ---- key numbers
  function vTablo(v) {
    const c = D.chif, j = D.jour_j || { entres: 0, attendus: 0 };
    const restan = D.types.reduce((s, t) => s + Math.max(t.restants, 0), 0);
    v.append(el("div", { className: "kpi" }, ...[["Enskri", c.inscrits], ["Peye", c.payes], ["An atant", c.en_attente], ["Poko peye", c.sans_paiement], ["Refize", c.refuses], ["Lajan antre", SB.goud(c.recettes_htg)], ["Plas ki rete", restan], ["Jou J: antre", `${j.entres} / ${j.attendus}`]]
      .map(([k, n]) => el("div", {}, el("small", { textContent: k }), el("b", { textContent: n })))));
    v.append(el("h3", { textContent: "Plas pa tikè" }));
    v.append(el("div", { className: "kpi" }, ...D.types.map((t) => el("div", {}, el("small", { textContent: `${t.nom} · ${SB.goud(t.prix_htg || 0)}` }), el("b", { textContent: `${Math.max(t.restants, 0)} / ${t.quota}` })))));
    v.append(el("h3", { textContent: "Enskripsyon pa jou" }));
    const mx = Math.max(1, ...D.par_jour.map((d) => d.n));
    v.append(el("div", { className: "bars" }, ...D.par_jour.map((d) => { const i = el("i", { title: `${d.jour}: ${d.n}` }); i.style.height = `${(d.n / mx) * 100}%`; return i; })));
  }

  // ---- full list, search, resend / cancel / refund, CSV
  function vLis(v) {
    v.append(el("p", { className: "mute small", style: "margin:0 0 8px", textContent: "Yon moun pèdi tikè l? Chèche non l, nimewo WhatsApp li oswa kòd AT-… li, epi klike « Revoye tikè a »: li resevwa l dirèkteman sou WhatsApp." }));
    const s = el("input", { className: "srch", placeholder: "Chèche non, telefòn oswa kòd…", value: FILT }); v.append(s);
    const box = el("div"); v.append(box);
    const rann = () => {
      const q = FILT.toLowerCase();
      const L = D.lis.filter((x) => !q || [x.nom, x.telephone, x.code_court, x.reference].some((y) => String(y || "").toLowerCase().includes(q)));
      box.replaceChildren(el("p", { className: "mute small", textContent: `${L.length} moun` }), ...L.slice(0, 200).map((x) => {
        const kv = el("dl", { className: "kv2" });
        [["Kòd", x.code_court], ["WhatsApp", x.telephone], ["Tikè", x.type], ["Peman", x.reference ? `${(x.moyen || "").toUpperCase()} · ${x.reference}` : "—"], ["Pa", x.valide_par], ["Motif", x.motif], ["Antre", x.scanne_le && SB.dat(x.scanne_le, { timeStyle: "short" })]]
          .forEach(([k, val]) => val && kv.append(el("dt", { textContent: k }), el("dd", { textContent: val })));
        const st = x.billet_statut && x.statut === "valide" ? x.billet_statut : x.statut;
        const a = el("div", { className: "act2" });
        if (x.billet && x.billet_statut !== "annule") {
          a.append(lyen("Revoye tikè a", wa(x.telephone, msgTike(x, x.billet))), lyen("Wè tikè a", `/billet/${x.billet}`));
          if (x.email) a.append(lyen("Imèl", `mailto:${x.email}?subject=${encodeURIComponent("Tikè Atelye AI " + x.code_court)}&body=${encodeURIComponent(msgTike(x, x.billet))}`));
          if (D.role === "admin") a.append(bouton("Anile tikè a", async () => { if (!confirm(`Anile tikè ${x.code_court}?`)) return; await SB.rpc("staf_anile", { p_code: KOD, p_id: x.id, p_ranbouse: false }); await chaje(); }, true));
          if (D.role === "admin") a.append(bouton("Ranbouse", async () => { if (!confirm(`Ranbouse ${x.nom}? Tikè a ap anile.`)) return; await SB.rpc("staf_anile", { p_code: KOD, p_id: x.id, p_ranbouse: true }); await chaje(); }, true));
        }
        return el("div", { className: "card" }, el("div", { className: "row2" }, el("h3", { style: "margin:0", textContent: x.nom }), el("span", { className: "bad " + st, textContent: st.replace("_", " ") })), kv, a);
      }));
    };
    s.oninput = () => { FILT = s.value; rann(); }; rann();
    if (D.role === "admin") v.prepend(el("div", { className: "act2", style: "margin:0 0 12px" }, bouton("Ekspòte CSV", async () => {
      const k = ["code_court", "nom", "telephone", "email", "type", "montant", "moyen", "reference", "statut", "motif", "billet", "billet_statut", "scanne_le", "cree_le", "valide_le", "valide_par"];
      const esc = (x) => `"${String(x ?? "").replace(/"/g, '""')}"`;
      const csv = [k.join(","), ...D.lis.map((x) => k.map((c) => esc(x[c])).join(",") + "," + esc(JSON.stringify(x.reponses || {})))].join("\n");
      const a = el("a", { download: `atelye-konferans-${new Date().toISOString().slice(0, 10)}.csv`, href: URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv" })) }); a.click();
    })));
  }

  // ---- cash payment
  function vKach(v) {
    const f = el("form", { className: "card" });
    f.innerHTML = `<h3 style="margin-top:0">Enskri yon moun sou plas</h3><p class="mute small">Pou yon pwen enskripsyon oswa yon moun ki peye w dirèkteman (kach): antre enfòmasyon l, tikè a fèt touswit, epi voye l ba li sou WhatsApp.</p>
      <label class="l">Tikè</label><select name="t"></select><label class="l">Non</label><input name="n" required><label class="l">WhatsApp</label><input name="p" type="tel" required><label class="l">Imèl (si w vle)</label><input name="e" type="email">
      <div class="msg hidden"></div><button class="btn full" style="margin-top:14px">Kreye ak valide</button>`;
    D.types.filter((t) => t.prix_htg != null).forEach((t) => f.t.append(el("option", { value: t.id, disabled: !!t.bloke || t.restants <= 0, textContent: `${t.nom} · ${SB.goud(t.prix_htg || 0)} · ${t.bloke ? "poko disponib" : Math.max(t.restants, 0) + " plas"}` })));
    const ok = el("div", { className: "card hidden", style: "margin-top:12px" });
    f.onsubmit = async (ev) => { ev.preventDefault(); const m = f.querySelector(".msg"); m.className = "msg hidden";
      try { const r = await SB.rpc("staf_kach", { p_code: KOD, p_type: f.t.value, p_nom: f.n.value, p_telephone: f.p.value, p_email: f.e.value || null });
        m.className = "msg ok"; m.textContent = `Tikè ${r.code_court} kreye pou ${r.nom} ✓`; f.reset();
        ok.replaceChildren(el("p", { style: "margin:0 0 10px;font-weight:600", textContent: `Voye tikè a bay ${r.nom} kounye a:` }),
          el("div", { className: "act2" }, el("a", { className: "btn", href: wa(r.telephone, msgTike(r, r.billet)), target: "_blank", rel: "noopener", textContent: "Voye sou WhatsApp" }), lyen("Wè tikè a", `/billet/${r.billet}`)));
        ok.classList.remove("hidden"); D = await SB.rpc("staf_tablo", { p_code: KOD }); }
      catch (e) { m.className = "msg err"; m.textContent = e.message; } };
    v.append(f, ok);
  }

  // ---- reminders J-7, J-1, morning (sent by hand from WhatsApp)
  function vRapel(v) {
    const M = {
      "J-7": (x) => `Bonjou ${premye(x.nom)}! Rete 7 jou pou atelye konferans Atelye AI a: samdi 28 novanm, 10h, Lise Anacaona, Leyogàn. Men tikè w: ${site}/billet/${x.billet}`,
      "J-1": (x) => `${premye(x.nom)}, se demen! 📅 Samdi 28 novanm, 10h, Lise Anacaona, Leyogàn. Pote telefòn ou (chaje) ak chajè a. Tikè w: ${site}/billet/${x.billet}`,
      "Maten": (x) => `Bonjou ${premye(x.nom)}! N ap tann ou jodi a a 10h nan Lise Anacaona, Leyogàn. Prepare tikè w la pou pòt la: ${site}/billet/${x.billet}`,
    };
    const L = D.lis.filter((x) => x.statut === "valide" && x.billet && x.billet_statut !== "annule");
    v.append(el("p", { className: "mute", textContent: `${L.length} moun ki gen tikè. Klike sou chak non pou voye mesaj la sou WhatsApp.` }));
    Object.entries(M).forEach(([k, f]) => {
      const d = el("details", { className: "card" }, el("summary", { innerHTML: `<b>${k}</b>` }));
      d.append(el("div", { className: "done", textContent: f({ nom: "{non}", billet: "{tikè}" }) }));
      d.append(el("div", { className: "act2" }, ...L.map((x) => lyen(x.nom, wa(x.telephone, f(x))))));
      d.append(el("div", { className: "act2" }, bouton("Kopye tout nimewo yo", async () => { await navigator.clipboard.writeText(L.map((x) => "+" + tel(x.telephone)).join("\n")); alert("Kopye ✓"); }, true)));
      v.append(d);
    });
  }


  // ---- my space: role, job, tasks, access and the photo badge
  function vMwen(v) {
    const b = { ...ME };
    if (!b.foto) v.append(el("div", { className: "alrt", textContent: "📷 Pran foto w kounye a: li obligatwa pou badj ou." }));
    const kol = el("div", { className: "grid2", style: "display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;align-items:start" });
    const gch = el("div"), drt = el("div", { className: "card mw" });
    gch.append(BADJ.rann(b));
    const fi = el("input", { type: "file", accept: "image/*", capture: "user", className: "hidden" });
    fi.onchange = async () => { const f = fi.files[0]; if (!f) return; try { await SB.rpc("staf_foto", { p_code: KOD, p_foto: await foto(f) }); await chaje(); TAB = "mwen"; afiche(); } catch (e) { alert(e.message); } };
    gch.append(el("div", { className: "act2", style: "justify-content:center;margin-top:14px" },
      el("button", { type: "button", className: "btn" + (b.foto ? " light" : ""), textContent: b.foto ? "📷 Chanje foto a" : "📷 Pran foto w", onclick: () => fi.click() }), fi,
      bouton("Telechaje badj la", async () => { const c = await BADJ.imaj(b); const a = el("a", { download: `badj-${b.non}.png`, href: c.toDataURL("image/png") }); a.click(); }, true)));
    drt.append(el("h3", { style: "margin-top:0", textContent: b.non }));
    const kv = el("dl", { className: "kv2" });
    [["Wòl", BADJ.ROL[b.role] || b.role], ["Fonksyon", b.fonksyon || "—"], ["Konekte ak", b.idantifyan || "kòd ekip"]].forEach(([k, x]) => kv.append(el("dt", { textContent: k }), el("dd", { textContent: x })));
    drt.append(kv, el("b", { textContent: "Aksè ou" }), el("ul", {}, ...(b.akse || []).map((x) => el("li", { textContent: x }))));
    drt.append(el("b", { textContent: "Travay ou" }), el("div", { className: "tr", textContent: b.travay || "Super admin lan poko ba w travay." }));
    if (b.role === "scanneur") drt.append(el("div", { className: "act2" }, bouton("Louvri eskanè a", async () => { try { localStorage.setItem("skane-kod", JSON.stringify(KOD)); } catch {} location.href = "/skane"; })));
    if (!b.idantifyan) {
      const f = el("form", { style: "margin-top:16px" });
      f.innerHTML = `<b>Konekte ak nimewo/Gmail ou</b><p class="mute small" style="margin:4px 0 0">Pou w pa bezwen kòd ekip la ankò.</p><label class="l">Nimewo WhatsApp oswa Gmail</label><input name="i" required><label class="l">Modpas (omwen 8 karaktè)</label><input name="m" type="password" minlength="8" required><div class="msg hidden"></div><button class="btn sm" style="margin-top:10px">Anrejistre</button>`;
      f.onsubmit = async (ev) => { ev.preventDefault(); const m = f.querySelector(".msg");
        try { await SB.rpc("staf_mete_kont", { p_code: KOD, p_idantifyan: f.i.value, p_modpas: f.m.value }); m.className = "msg ok"; m.textContent = "Anrejistre ✓"; } catch (e) { m.className = "msg err"; m.textContent = e.message; } };
      drt.append(f);
    }
    kol.append(gch, drt); v.append(kol);
  }

  // ---- team (super admin): approve sign-ups, give role, job and tasks, deactivate
  async function vEkip(v) {
    const L = await SB.rpc("staf_ekip", { p_code: KOD });
    const atant = L.filter((x) => x.statut === "en_attente");
    v.append(el("p", { className: "mute", textContent: atant.length ? `${atant.length} moun ap tann validasyon.` : "Pa gen moun k ap tann. Voye lyen sa a bay moun k ap travay avè w pou yo kreye kont yo: " + site + "/staf" }));
    L.forEach((x) => {
      const c = el("div", { className: "card ek" });
      const av = el("span", { className: "av", textContent: x.foto ? "" : (x.non || "?")[0] }); if (x.foto) av.style.backgroundImage = `url(data:image/jpeg;base64,${x.foto})`;
      const d = el("div");
      d.append(el("div", { className: "row2" }, el("h3", { style: "margin:0", textContent: x.non + (x.mwen ? " (ou menm)" : "") }), el("span", { className: "bad " + ({ actif: "valide", en_attente: "en_attente" }[x.statut] || "refuse"), textContent: { actif: "aktif", en_attente: "an atant", refuse: "refize", dezaktive: "dezaktive" }[x.statut] || x.statut })));
      d.append(el("p", { className: "mute small", style: "margin:4px 0 8px", textContent: (x.idantifyan || "kòd ekip") + " · " + SB.dat(x.cree_le, { day: "numeric", month: "short" }) }));
      const f = el("form");
      f.innerHTML = `<label class="l">Wòl</label><select name="r"><option value="">Chwazi…</option><option value="vandeur">Vandè: enskri moun sou plas, revoye tikè</option><option value="validateur">Validatè: valide peman</option><option value="scanneur">Eskanè: pòt la</option><option value="admin">Super admin: tout bagay</option></select>
        <label class="l">Fonksyon (sou badj la)</label><input name="f" placeholder="Egz. Responsab enskripsyon Leyogàn">
        <label class="l">Travay li</label><textarea name="t" rows="3" placeholder="Yon travay pa liy"></textarea>`;
      f.r.value = x.role || ""; f.f.value = x.fonksyon || ""; f.t.value = x.travay || "";
      const mete = (st) => bouton(st === "actif" ? (x.statut === "actif" ? "Anrejistre" : "Valide kont lan") : st === "refuse" ? "Refize" : "Dezaktive", async () => {
        if (st !== "actif" && !confirm(`${st === "refuse" ? "Refize" : "Dezaktive"} ${x.non}?`)) return;
        await SB.rpc("staf_ekip_mete", { p_code: KOD, p_id: x.id, p_statut: st, p_role: f.r.value || null, p_fonksyon: f.f.value, p_travay: f.t.value }); TAB = "ekip"; afiche(); }, st !== "actif");
      const a = el("div", { className: "act2" }, mete("actif"));
      if (x.statut === "en_attente") a.append(mete("refuse"));
      else if (!x.mwen && x.statut === "actif") a.append(mete("dezaktive"));
      if (x.statut === "actif") a.append(lyen("Wè badj li", `/badj/${x.badj}`));
      d.append(f, a); c.append(av, d); v.append(c);
    });
    const g = el("form");
    g.innerHTML = `<h3 style="margin-top:0">Ansyen metòd: yon kòd ekip</h3><p class="mute small">Validatè: valide peman sèlman. Eskanè: pòt la jou J sèlman. Bay chak moun pwòp kòd li (omwen 10 karaktè).</p>
      <label class="l">Non</label><input name="n" required><label class="l">Wòl</label><select name="r"><option value="vandeur">Vandè (enskri moun sou plas, revoye tikè)</option><option value="validateur">Validatè (valide peman)</option><option value="scanneur">Eskanè (pòt la)</option><option value="admin">Admin</option></select>
      <label class="l">Kòd</label><input name="k" minlength="10" required><div class="msg hidden"></div><button class="btn full" style="margin-top:14px">Kreye kòd la</button>`;
    g.onsubmit = async (ev) => { ev.preventDefault(); const m = g.querySelector(".msg");
      try { await SB.rpc("staf_kreye", { p_code: KOD, p_non: g.n.value, p_role: g.r.value, p_nouvo_code: g.k.value }); m.className = "msg ok"; m.textContent = "Kòd la kreye ✓ Voye l bay moun nan an prive."; g.reset(); }
      catch (er) { m.className = "msg err"; m.textContent = er.message; } };
    v.append(el("details", { className: "card" }, el("summary", { textContent: "Kreye yon kòd ekip (san kont)" }), g));
  }

  // ---- event, ticket types (prices, quotas, early-bird date)
  function vParam(v) {
    const e = D.evenement || {}, f = el("form", { className: "card" });
    const loc = (iso) => iso ? new Date(new Date(iso).getTime() - 5 * 3600e3).toISOString().slice(0, 16) : "";
    f.innerHTML = `<h3 style="margin-top:0">Evènman an</h3>
      <label class="l">Non</label><input name="nom"><label class="l">Dat ak lè (lè Ayiti)</label><input name="date" type="datetime-local">
      <label class="l">Kote</label><input name="lieu"><label class="l">Adrès</label><input name="adresse"><label class="l">Kapasite (plas an tout)</label><input name="capacite" type="number" min="1">
      <label class="l">Estati</label><select name="statut"><option value="ouvert">Louvri</option><option value="ferme">Fèmen</option></select>
      <h3>Tikè yo</h3><p class="mute small">Non · pri $ · pri goud · kota (kantite plas) · dènye dat vant (vid = pa gen limit). Pou rabè premye yo: yon tikè pi bon mache ak yon kota oswa yon dat. Pou retire yon tikè sou sit la: kite pri goud la vid. Tikè lève-bonè a disparèt pou kont li apre dat la.</p><div id="tps"></div>
      <button type="button" class="btn sm light" id="tp-plis">+ Yon tip tikè</button>
      <div class="msg hidden"></div><button class="btn full" style="margin-top:14px">Anrejistre</button>`;
    f.nom.value = e.nom || "Atelye konferans Atelye AI"; f.date.value = loc(e.date); f.lieu.value = e.lieu || ""; f.adresse.value = e.adresse || ""; f.capacite.value = e.capacite || 100; f.statut.value = e.statut || "ouvert";
    const tps = f.querySelector("#tps");
    const liy = (t = {}) => { const r = el("div", { className: "tp2" });
      r.innerHTML = `<input placeholder="Non" name="n"><input placeholder="$" name="u" inputmode="decimal"><input placeholder="Goud" name="h" inputmode="numeric"><input placeholder="Kota" name="q" inputmode="numeric"><input type="datetime-local" name="d">`;
      r.dataset.id = t.id || ""; r.querySelector("[name=n]").value = t.nom || ""; r.querySelector("[name=u]").value = t.prix_usd ?? ""; r.querySelector("[name=h]").value = t.prix_htg ?? ""; r.querySelector("[name=q]").value = t.quota ?? ""; r.querySelector("[name=d]").value = loc(t.date_fin_vente);
      tps.append(r); };
    (D.types.length ? D.types : [{ nom: "Lève-bonè" }, { nom: "Estanda" }]).forEach(liy);
    f.querySelector("#tp-plis").onclick = () => liy();
    const iso = (s) => s ? s + ":00-05:00" : "";
    f.onsubmit = async (ev) => { ev.preventDefault(); const m = f.querySelector(".msg"); m.className = "msg hidden";
      try {
        const types = [...tps.children].map((r, i) => ({ id: r.dataset.id, nom: r.querySelector("[name=n]").value.trim(), prix_usd: r.querySelector("[name=u]").value, prix_htg: r.querySelector("[name=h]").value, quota: Number(r.querySelector("[name=q]").value || 0), date_fin_vente: iso(r.querySelector("[name=d]").value), ordre: i})).filter((t) => t.nom);
        await SB.rpc("staf_evenement", { p_code: KOD, p_evenement: { id: e.id || "", nom: f.nom.value, date: iso(f.date.value), lieu: f.lieu.value, adresse: f.adresse.value, capacite: Number(f.capacite.value), statut: f.statut.value }, p_types: types });
        m.className = "msg ok"; m.textContent = "Anrejistre ✓"; await chaje(); TAB = "param";
      } catch (er) { m.className = "msg err"; m.textContent = er.message; } };
    v.append(f);
  }
})();
</script>
</body>
</html>
