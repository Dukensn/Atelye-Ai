<!doctype html>
<html lang="ht">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ekip · Atelye konferans</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/icon.png">
<link rel="stylesheet" href="/style.css">
<style>
  :root { --bg2: #f5f6f8; --ln2: #eceef2; --ink2: #111827; --mu2: #6b7280; --grn: #16a34a; --org: #f59e0b; }
  body { background: var(--bg2); color: var(--ink2); }
  main { max-width: 1120px; margin: 0 auto; padding: 18px 16px 110px; }
  .card { background: #fff; border: 1px solid var(--ln2); border-radius: 18px; box-shadow: 0 1px 2px rgba(16,24,40,.04); }
  #app h3 { letter-spacing: -0.01em; }
  /* app shell: side menu on computers, bottom menu on phones */
  .shell { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 22px; align-items: start; }
  .nv { position: sticky; top: 84px; display: grid; gap: 4px; background: #fff; border: 1px solid var(--ln2); border-radius: 18px; padding: 10px; }
  .nv button { position: relative; display: flex; align-items: center; gap: 12px; border: 0; background: none; font: inherit; font-weight: 600; font-size: 15px;
    color: var(--mu2); padding: 11px 12px; border-radius: 12px; cursor: pointer; text-align: left; }
  .nv button svg { flex: none; width: 21px; height: 21px; }
  .nv button[aria-selected="true"] { background: #111; color: #fff; }
  .nv .nb { margin-left: auto; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: #ef4444; color: #fff; font-size: 12px; font-weight: 800; display: grid; place-items: center; }
  @media (max-width: 900px) {
    .shell { display: block; }
    .nv { position: fixed; z-index: 30; left: 0; right: 0; bottom: 0; top: auto; display: flex; gap: 2px; overflow-x: auto; border-radius: 20px 20px 0 0; border-width: 1px 0 0;
      padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); box-shadow: 0 -6px 20px rgba(16,24,40,.08); scrollbar-width: none; }
    .nv::-webkit-scrollbar { display: none; }
    .nv button { flex: 1 0 68px; flex-direction: column; gap: 3px; font-size: 11px; padding: 7px 4px; text-align: center; }
    .nv button[aria-selected="true"] { background: #f1f2f4; color: #111; }
    .nv .nb { position: absolute; top: 3px; right: 10px; margin: 0; min-width: 18px; height: 18px; font-size: 11px; }
  }
  .hi { display: flex; align-items: center; gap: 12px; margin: 0 0 16px; }
  .hi .av2 { flex: none; width: 48px; height: 48px; border-radius: 50%; background: #eee center/cover no-repeat; display: grid; place-items: center; font-weight: 800; color: #999; box-shadow: 0 0 0 3px #fff, 0 0 0 5px var(--rk, #ddd); }
  .hi h2 { margin: 0; font-size: 22px; letter-spacing: -0.02em; } .hi small { color: var(--mu2); font-weight: 600; }
  .hi .rk { display: inline-block; font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 6px; margin-left: 6px; }
  /* home dashboard */
  .k4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  @media (max-width: 900px) { .k4 { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; } }
  .kt { background: #fff; border: 1px solid var(--ln2); border-radius: 18px; padding: 16px; }
  .kt .ic { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; margin-bottom: 10px; } .kt .ic svg { width: 19px; height: 19px; }
  .kt small { display: block; color: var(--mu2); font-weight: 600; font-size: 13px; }
  .kt b { display: block; font-size: 26px; letter-spacing: -0.03em; margin-top: 2px; } .kt b.g { color: var(--grn); }
  .kt em { font-style: normal; font-size: 12px; font-weight: 700; color: var(--mu2); }
  .g2 { display: grid; grid-template-columns: 1.3fr 1fr; gap: 14px; margin-top: 14px; } @media (max-width: 900px) { .g2 { grid-template-columns: 1fr; } }
  .bx { background: #fff; border: 1px solid var(--ln2); border-radius: 18px; padding: 16px 18px; }
  .bx h4 { margin: 0 0 12px; font-size: 15px; display: flex; justify-content: space-between; } .bx h4 small { color: var(--mu2); font-weight: 600; }
  .bars { display: flex; align-items: flex-end; gap: 6px; height: 150px; padding: 0; overflow-x: auto; background: none; border-radius: 0; }
  .bars div { flex: 1 0 22px; max-width: 56px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 4px; font-size: 11px; color: var(--mu2); font-weight: 600; }
  .bars i { width: 100%; min-height: 4px; background: linear-gradient(180deg, #fbbf24, #f59e0b); border-radius: 6px 6px 3px 3px; display: block; }
  .rw { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--ln2); } .rw:first-of-type { border-top: 0; }
  .ai { flex: none; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 14px; color: #fff; }
  #v { padding: 0; } .py .tp4 .tx b { font-size: 16px; }
  .rw .tx { flex: 1; min-width: 0; } .rw .tx b { display: block; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .rw .tx small { color: var(--mu2); font-size: 12px; }
  .rw .mt { text-align: right; font-weight: 800; font-size: 14px; white-space: nowrap; }
  .pl { display: inline-block; font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 999px; margin-top: 3px; }
  .pl.ok { background: #dcfce7; color: #15803d; } .pl.at { background: #fef3c7; color: #92400e; } .pl.ko { background: #fee2e2; color: #b91c1c; }
  .tp3 { display: flex; align-items: center; gap: 10px; margin-top: 10px; } .tp3 .tr2 { flex: 1; height: 10px; background: #f1f2f4; border-radius: 5px; overflow: hidden; } .tp3 .tr2 i { display: block; height: 100%; border-radius: 5px; background: #111; }
  .tp3 span { font-size: 13px; font-weight: 700; min-width: 64px; text-align: right; }
  /* payment to check */
  .py { padding: 16px; } .py .tp4 { display: flex; align-items: center; gap: 12px; }
  .py .mn { font-size: 26px; font-weight: 800; letter-spacing: -0.03em; margin: 12px 0 2px; }
  .py .mo { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; font-weight: 700; padding: 5px 10px; border-radius: 8px; background: #f1f2f4; }
  .py .mo.mc { background: #fee2e2; color: #b91c1c; } .py .mo.nc { background: #ffedd5; color: #c2410c; } .py .mo.ka { background: #dcfce7; color: #15803d; }
  .py code { font-family: ui-monospace, Menlo, monospace; font-size: 14px; font-weight: 700; letter-spacing: .04em; }
  .py .act2 .btn { flex: 1 1 140px; } .btn.vrt { background: var(--grn); color: #fff; }
  /* notifications, like "Nouvo vant!" */
  .tst { position: fixed; z-index: 60; top: 14px; left: 50%; transform: translateX(-50%); display: grid; gap: 8px; width: min(380px, calc(100% - 24px)); pointer-events: none; }
  .tst div { display: flex; align-items: center; gap: 12px; background: #fff; border-radius: 16px; padding: 12px 14px; box-shadow: 0 14px 34px rgba(16,24,40,.18); animation: tin .35s ease-out; pointer-events: auto; }
  .tst div i { flex: none; width: 36px; height: 36px; border-radius: 11px; background: #dcfce7; color: #15803d; display: grid; place-items: center; font-style: normal; font-weight: 800; }
  .tst div b { display: block; font-size: 14px; } .tst div small { color: var(--mu2); font-size: 13px; }
  @keyframes tin { from { transform: translateY(-14px); opacity: 0; } }
  .tabs3 { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 16px; }
  .tabs3 button { flex: none; border: 0; padding: 10px 14px; border-radius: 999px; background: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  .tabs3 button[aria-selected="true"] { background: #0f0f0f; color: #fff; }
  .kpi { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .kpi div { background: #fff; border: 1px solid var(--ln2); border-radius: 16px; padding: 14px 16px; }
  .kpi small { color: var(--mute); font-weight: 600; } .kpi b { display: block; font-size: 28px; letter-spacing: -0.02em; }
  .row2 { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .kv2 { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 14px; margin: 10px 0; }
  .kv2 dt { color: var(--mute); } .kv2 dd { margin: 0; word-break: break-word; }
  .act2 { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .bad { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 6px; background: var(--soft); }
  .bad.valide { background: #e7f4ec; color: var(--ok); } .bad.refuse, .bad.annule, .bad.rembourse { background: #fdecea; color: var(--bad); }
  .bad.en_attente { background: #fff1d6; color: #8a5a00; } .bad.utilise { background: #e7f0fd; color: #1d4ed8; }
  .kapti { max-width: 100%; border-radius: 10px; margin-top: 8px; display: block; }
  label.l { display: block; font-weight: 600; font-size: 14px; margin: 12px 0 6px; }
  select { width: 100%; font: inherit; font-size: 16px; padding: 12px 14px; border: 0; border-radius: 10px; background: var(--soft); }
  .tp2 { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 1.6fr; gap: 6px; margin-bottom: 8px; }
  .tp2 input, .tp2 textarea { padding: 10px; font-size: 14px; }
  .tp2 { padding-bottom: 12px; border-bottom: 1px solid var(--line); }
  @media (max-width: 700px) { .tp2 { grid-template-columns: 1fr 1fr; } }
  .srch { margin-bottom: 10px; }
  .fot { display: flex; align-items: center; gap: 12px; }
  .fot span, .ek .av { flex: none; width: 64px; height: 64px; border-radius: 50%; background: #eee center/cover no-repeat; display: grid; place-items: center; font-weight: 800; color: #aaa; }
  .ek { display: flex; gap: 12px; align-items: flex-start; } .ek > div { flex: 1; min-width: 0; }
  .ek textarea, .mw textarea { width: 100%; font: inherit; border: 0; border-radius: 10px; background: var(--soft); padding: 10px; }
  .mw ul { margin: 6px 0 0; padding-left: 18px; } .mw li { margin: 3px 0; }
  .mw .tr { white-space: pre-wrap; background: var(--soft); border-radius: 10px; padding: 10px; }
  .alrt { background: #fff1d6; color: #8a5a00; border-radius: 12px; padding: 12px; font-weight: 600; margin-bottom: 12px; }
  .ak { display: grid; gap: 6px; } .ck { display: flex; gap: 10px; align-items: center; font-size: 15px; padding: 8px 10px; background: var(--soft); border-radius: 10px; }
  .ck input { width: auto; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; } .chips span { font-size: 12px; font-weight: 600; padding: 4px 8px; border-radius: 6px; background: var(--soft); }
  .done { white-space: pre-wrap; font-size: 14px; background: var(--soft); border-radius: 10px; padding: 10px; }
</style>
</head>
<body>
<header class="top"><div class="wrap"><a href="/konferans" aria-label="Atelye AI"><img src="/logo.png" alt="Atelye AI"></a><nav><span class="mute small" id="moun"></span><button class="btn sm light hidden" id="soti" type="button">Soti</button></nav></div></header>
<main>
  <div id="login" class="card" style="max-width:440px;margin:30px auto">
    <h2 style="margin-top:0">Espas ekip la</h2>
    <nav class="tabs3" id="lt"><button type="button" data-m="k" aria-selected="true">Konekte</button><button type="button" data-m="e" aria-selected="false">Kreye kont</button></nav>
    <form id="fk">
      <label class="l" for="li">Nimewo WhatsApp oswa Gmail</label><input id="li" autocomplete="username" required>
      <label class="l" for="lm">Modpas</label><input id="lm" type="password" autocomplete="current-password" required>
      <div class="msg hidden"></div><button class="btn full" style="margin-top:14px">Antre</button>
      <p class="mute small" style="text-align:center;margin:12px 0 0"><a href="#" id="akod">Mwen gen yon kòd ekip</a></p>
    </form>
    <form id="fkod" class="hidden">
      <label class="l" for="kod">Kòd ekip</label><input id="kod" type="password" autocomplete="current-password" required>
      <div class="msg hidden"></div><button class="btn full" style="margin-top:14px">Antre ak kòd la</button>
    </form>
    <form id="fe" class="hidden">
      <p class="mute small" style="margin:0">Kreye kont ou. Super admin lan ap valide l epi ba w wòl ou.</p>
      <label class="l" for="en">Non konplè</label><input id="en" autocomplete="name" required>
      <label class="l" for="ei">Nimewo WhatsApp oswa Gmail</label><input id="ei" autocomplete="username" required>
      <label class="l" for="em">Modpas (omwen 8 karaktè)</label><input id="em" type="password" autocomplete="new-password" minlength="8" required>
      <label class="l">Foto w (pou badj la)</label>
      <div class="fot"><span id="fp"></span><label class="btn sm light" for="ef">📷 Pran yon foto</label><input id="ef" type="file" accept="image/*" capture="user" class="hidden"></div>
      <div class="msg hidden"></div><button class="btn full" style="margin-top:14px">Voye demann lan</button>
    </form>
  </div>

  <div id="app" class="hidden">
    <div class="hi"><span class="av2" id="av2"></span><div><h2 id="bon">Bonjou</h2><small><span id="evt">—</span> · <span id="mizajou"></span></small></div></div>
    <div class="shell"><nav class="nv" id="tabs" aria-label="Meni"></nav><section id="v"></section></div>
  </div>
  <div class="tst" id="tst" aria-live="polite"></div>
</main>
<script src="/vendor/qrcode.js"></script>
<script src="/sb.js"></script>
<script src="/badj.js"></script>
<script>
(() => {
  const $ = (q) => document.querySelector(q);
  const el = (t, p = {}, ...c) => { const e = Object.assign(document.createElement(t), p); e.append(...c.filter((x) => x != null)); return e; };
  let KOD = "", D = null, ME = null, TAB = "file", FILT = "", VI = false, PREMYE = true;
  try { KOD = localStorage.getItem("staf-kod") || sessionStorage.getItem("staf-kod") || ""; } catch {}
  const site = location.origin;
  const tel = (t) => { const d = String(t || "").replace(/\D/g, ""); return d.length === 8 ? "509" + d : d; };
  const wa = (t, msg) => `https://wa.me/${tel(t)}?text=${encodeURIComponent(msg)}`;
  const premye = (n) => String(n || "").split(" ")[0];
  const msgTike = (x, code) => `Bonjou ${premye(x.nom)}! 🎉 Peman w lan valide. Men tikè w pou atelye konferans Atelye AI a (${x.code_court}):\n${site}/billet/${code}\n\nSamdi 28 novanm, 10h, Lise Anacaona, Leyogàn. Montre kòd QR a nan pòt la.`;
  const msgRefi = (x, motif) => `Bonjou ${premye(x.nom)}. Se Atelye AI. Nou pa t ka valide peman pou enskripsyon ${x.code_court}: ${motif}. Reponn mesaj sa a pou n regle sa ansanm.`;

  const AK = (k) => !!(ME && (ME.akse_kle || []).includes(k));
  const sv = (d) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>`;
  const IK = {
    tablo: sv("M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"), file: sv("M9 12l2 2 4-4M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z"),
    kach: sv("M15 19a6 6 0 0 0-12 0M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM19 8v6M22 11h-6"), lis: sv("M21 21l-4.3-4.3M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14z"),
    rapel: sv("M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10 21a2 2 0 0 0 4 0"), ekip: sv("M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM23 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"),
    wol: sv("M12 2l8 4v6c0 5-3.5 9-8 10-4.5-1-8-5-8-10V6z"), param: sv("M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"),
    mwen: sv("M4 4h16v16H4zM12 11a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5zM7.5 17c.8-2.4 8.2-2.4 9 0") };
  // notifications: a new payment to check or a new sign-up since the last refresh
  let VI2 = null, NEK = 0;
  function tost(ik, tit, det) {
    const t = el("div", {}, el("i", { textContent: ik }), el("span", {}, el("b", { textContent: tit }), el("small", { textContent: det })));
    $("#tst").append(t); if (navigator.vibrate) navigator.vibrate(60); setTimeout(() => t.remove(), 6000);
  }
  function nouvo() {
    const fi = new Set(D.file.map((x) => x.id)), li = new Set((D.lis || []).map((x) => x.id));
    if (VI2) {
      D.file.filter((x) => !VI2.fi.has(x.id)).slice(0, 3).forEach((x) => tost("$", "Nouvo peman pou verifye", `${x.nom} · ${SB.goud(x.montant)}`));
      (D.lis || []).filter((x) => !VI2.li.has(x.id) && !fi.has(x.id)).slice(0, 3).forEach((x) => tost("+", "Nouvo enskripsyon", `${x.nom} · ${x.type}`));
    }
    VI2 = { fi, li };
  }
  const KL = ["#f59e0b", "#3b82f6", "#22c55e", "#a855f7", "#ef4444", "#0ea5e9", "#14b8a6"];
  const ai = (n) => { const s = String(n || "?"); let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) >>> 0;
    return el("span", { className: "ai", textContent: s.split(/\s+/).filter(Boolean).map((x) => x[0]).join("").slice(0, 2).toUpperCase(), style: `background:${KL[h % KL.length]}` }); };
  async function chaje() {
    ME = await SB.rpc("staf_mwen", { p_code: KOD });
    D = await SB.rpc("staf_tablo", { p_code: KOD });
    $("#evt").textContent = D.evenement ? D.evenement.nom : "Pa gen evènman";
    $("#moun").textContent = `${D.non} · ${ME.role_non || D.role}`;
    $("#mizajou").textContent = "Mizajou " + new Date().toLocaleTimeString("fr-HT", { hour: "2-digit", minute: "2-digit" });
    // tabs follow the access rights of the member's role
    const T = [
      AK("chif") && ["tablo", "Akèy"], AK("valide_peman") && ["file", "Peman"],
      AK("enskri_sou_plas") && ["kach", "Enskri yon moun"],
      (AK("lis_enskripsyon") || AK("jwenn_tike")) && ["lis", AK("lis_enskripsyon") ? "Enskripsyon" : "Jwenn yon tikè"], AK("rapel") && ["rapel", "Rapèl"],
      AK("jere_ekip") && ["ekip", "Ekip"], AK("jere_ekip") && ["wol", "Wòl"], AK("pri_evenman") && ["param", "Paramèt"], ["mwen", "Badj mwen"]].filter(Boolean);
    NEK = AK("jere_ekip") ? (await SB.rpc("staf_ekip", { p_code: KOD }).catch(() => [])).filter((x) => x.statut === "en_attente").length : 0;
    nouvo();
    if (!ME.foto && !VI) TAB = "mwen";   // first screen asks for the badge photo
    VI = true;
    if (!T.some(([k]) => k === TAB)) TAB = T[0][0];
    $("#tabs").replaceChildren(...T.map(([k, t]) => { const b = el("button", { type: "button", innerHTML: IK[k] || "" }); b.append(el("span", { textContent: t }));
      const n = { file: D.file.length, ekip: NEK }[k]; if (n) b.append(el("span", { className: "nb", textContent: n }));
      b.dataset.k = k; b.setAttribute("aria-selected", String(k === TAB)); b.onclick = () => { TAB = k; afiche(); scrollTo(0, 0); chaje().catch(() => {}); }; return b; }));
    $("#bon").textContent = "Bonjou, " + premye(ME.non);
    const av = $("#av2"); av.style.setProperty("--rk", ME.koule || "#ddd");
    if (ME.foto) { av.style.backgroundImage = `url(data:image/jpeg;base64,${ME.foto})`; av.textContent = ""; } else av.textContent = (ME.non || "?")[0];
    // redraw only screens without forms, so a refresh never wipes what someone is typing
    if (PREMYE || ["tablo", "file", "lis"].includes(TAB)) afiche();
    PREMYE = false;
  }
  async function antre(k) {
    KOD = k; await SB.rpc("staf_konekte", { p_code: KOD });
    try { localStorage.setItem("staf-kod", KOD); } catch {}
    $("#login").classList.add("hidden"); $("#app").classList.remove("hidden"); $("#soti").classList.remove("hidden");
    await chaje(); setInterval(() => chaje().catch(() => {}), 60000);
  }
  const erè = (f, e) => { const m = f.querySelector(".msg"); m.className = "msg err"; m.textContent = e.message; };
  // login screen: number/Gmail + password, old team code, or a new account waiting for approval
  $("#lt").onclick = (ev) => { const m = ev.target.dataset.m; if (!m) return;
    $("#lt").querySelectorAll("button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.m === m)));
    $("#fk").classList.toggle("hidden", m !== "k"); $("#fkod").classList.add("hidden"); $("#fe").classList.toggle("hidden", m !== "e"); };
  $("#akod").onclick = (ev) => { ev.preventDefault(); $("#fk").classList.add("hidden"); $("#fkod").classList.remove("hidden"); };
  $("#fk").onsubmit = async (ev) => { ev.preventDefault(); const f = ev.target; f.querySelector(".msg").className = "msg hidden";
    try { const r = await SB.rpc("staf_login", { p_idantifyan: $("#li").value, p_modpas: $("#lm").value }); await antre(r.token); } catch (e) { erè(f, e); } };
  $("#fkod").onsubmit = (ev) => { ev.preventDefault(); antre($("#kod").value).catch((e) => erè(ev.target, e)); };
  // phone photos are big: square crop, 480 px JPEG
  const foto = (file) => new Promise((ok, ko) => { const i = new Image(); i.onload = () => {
      const s = Math.min(i.width, i.height), c = document.createElement("canvas"); c.width = c.height = 480;

    const [L, W] = await Promise.all([SB.rpc("staf_ekip", { p_code: KOD }), SB.rpc("staf_wol", { p_code: KOD })]);
    const atant = L.filter((x) => x.statut === "en_attente");
    v.append(el("p", { className: "mute", textContent: atant.length ? `${atant.length} moun ap tann validasyon.` : "Pa gen moun k ap tann. Voye lyen sa a bay moun k ap travay avè w pou yo kreye kont yo: " + site + "/staf" }));
    L.forEach((x) => {
      const c = el("div", { className: "card ek" });
      const av = el("span", { className: "av", textContent: x.foto ? "" : (x.non || "?")[0] }); if (x.foto) av.style.backgroundImage = `url(data:image/jpeg;base64,${x.foto})`;
      const d = el("div");
      d.append(el("div", { className: "row2" }, el("h3", { style: "margin:0", textContent: x.non + (x.mwen ? " (ou menm)" : "") }), el("span", { className: "bad " + ({ actif: "valide", en_attente: "en_attente" }[x.statut] || "refuse"), textContent: { actif: "aktif", en_attente: "an atant", refuse: "refize", dezaktive: "dezaktive" }[x.statut] || x.statut })));
      d.append(el("p", { className: "mute small", style: "margin:4px 0 8px", textContent: (x.idantifyan || "kòd ekip") + " · " + SB.dat(x.cree_le, { day: "numeric", month: "short" }) }));
      const f = el("form");
      f.innerHTML = `<label class="l">Wòl</label><select name="r">${opsyon(W)}</select><p class="mute small rd" style="margin:6px 0 0"></p>
        <label class="l">Fonksyon (sou badj la)</label><input name="f" placeholder="Egz. Responsab enskripsyon Leyogàn">
        <label class="l">Travay li</label><textarea name="t" rows="3" placeholder="Yon travay pa liy"></textarea>`;
      f.r.value = x.role || ""; f.f.value = x.fonksyon || ""; f.t.value = x.travay || "";
      const dk = () => { const w = W.wol.find((y) => y.kle === f.r.value); f.querySelector(".rd").textContent = w ? (w.deskripsyon || "") + (w.akse.length ? " · Aksè: " + w.akse.map((a) => (W.katalog.find((k) => k.kle === a) || {}).non).join(", ") : " · Badj sèlman") : ""; };
      f.r.onchange = dk; dk();
      const mete = (st) => bouton(st === "actif" ? (x.statut === "actif" ? "Anrejistre" : "Valide kont lan") : st === "refuse" ? "Refize" : "Dezaktive", async () => {
        if (st !== "actif" && !confirm(`${st === "refuse" ? "Refize" : "Dezaktive"} ${x.non}?`)) return;
        await SB.rpc("staf_ekip_mete", { p_code: KOD, p_id: x.id, p_statut: st, p_role: f.r.value || null, p_fonksyon: f.f.value, p_travay: f.t.value }); TAB = "ekip"; afiche(); }, st !== "actif");
      const a = el("div", { className: "act2" }, mete("actif"));
      if (x.statut === "en_attente") a.append(mete("refuse"));
      else if (!x.mwen && x.statut === "actif") a.append(mete("dezaktive"));
      if (x.statut === "actif") a.append(lyen("Wè badj li", `/badj/${x.badj}`));
      d.append(f, a); c.append(av, d); v.append(c);
    });
    const g = el("form");
    g.innerHTML = `<h3 style="margin-top:0">Ansyen metòd: yon kòd ekip</h3><p class="mute small">Bay chak moun pwòp kòd li (omwen 10 karaktè).</p>
      <label class="l">Non</label><input name="n" required><label class="l">Wòl</label><select name="r" required>${opsyon(W)}</select>
      <label class="l">Kòd</label><input name="k" minlength="10" required><div class="msg hidden"></div><button class="btn full" style="margin-top:14px">Kreye kòd la</button>`;
    g.onsubmit = async (ev) => { ev.preventDefault(); const m = g.querySelector(".msg");
      try { await SB.rpc("staf_kreye", { p_code: KOD, p_non: g.n.value, p_role: g.r.value, p_nouvo_code: g.k.value }); m.className = "msg ok"; m.textContent = "Kòd la kreye ✓ Voye l bay moun nan an prive."; g.reset(); }
      catch (er) { m.className = "msg err"; m.textContent = er.message; } };
    v.append(el("details", { className: "card" }, el("summary", { textContent: "Kreye yon kòd ekip (san kont)" }), g));
  }

  // ---- roles: you name them, describe them and tick their access; every super admin approves each change
  async function vWol(v) {
    const W = await SB.rpc("staf_wol", { p_code: KOD });
    const kat = (k) => (W.katalog.find((x) => x.kle === k) || {}).non || k;
    const atant = W.chanjman.filter((c) => c.statut === "an_atant");
    v.append(el("p", { className: "mute", textContent: `Chak chanjman sou yon wòl (kreye, modifye, retire) dwe valide pa tout super admin yo (${W.n_admin}) anvan li aplike.` }));
    if (atant.length) {
      v.append(el("h3", { textContent: `Chanjman k ap tann (${atant.length})` }));
      atant.forEach((c) => {
        const d = el("div", { className: "card" });
        const tit = { kreye: "Nouvo wòl", modifye: "Modifye wòl", efase: "Retire wòl" }[c.aksyon] + ": " + (c.done.non || (W.wol.find((w) => w.kle === c.wol_kle) || {}).non || "");
        d.append(el("div", { className: "row2" }, el("h3", { style: "margin:0", textContent: tit }), el("span", { className: "bad en_attente", textContent: `${c.apwouve.length}/${W.n_admin} valide` })));
        if (c.aksyon !== "efase") d.append(el("p", { className: "mute small", textContent: (c.done.deskripsyon || "") + " · Aksè: " + ((c.done.akse || []).map(kat).join(", ") || "badj sèlman") }));
        d.append(el("p", { className: "mute small", textContent: `Pwopoze pa ${c.pwopoze_pa || "?"} · Valide pa: ${c.apwouve.join(", ") || "pèsonn"}` }));
        if (W.admin && !c.mwen_apwouve) d.append(el("div", { className: "act2" },
          bouton("Valide", async () => { await SB.rpc("staf_wol_vote", { p_code: KOD, p_id: c.id, p_dakò: true }); TAB = "wol"; afiche(); }),
          bouton("Refize", async () => { if (!confirm("Refize chanjman sa a?")) return; await SB.rpc("staf_wol_vote", { p_code: KOD, p_id: c.id, p_dakò: false }); TAB = "wol"; afiche(); }, true)));
        else d.append(el("p", { className: "small", style: "margin:0", textContent: c.mwen_apwouve ? "Ou valide l deja. N ap tann lòt admin yo." : "Se super admin yo ki valide." }));
        v.append(d);
      });
    }
    // form to create or edit a role
    const fòm = (w) => {
      const f = el("form", { className: "card" });
      f.innerHTML = `<h3 style="margin-top:0">${w ? "Modifye: " + esk(w.non) : "Nouvo wòl"}</h3>
        <label class="l">Non wòl la</label><input name="n" maxlength="40" required placeholder="Egz. Fotograf">
        <label class="l">Deskripsyon</label><textarea name="d" rows="2" maxlength="300" placeholder="Sa moun ki gen wòl sa a fè"></textarea>
        <label class="l">Koulè sou badj la</label><input name="k" type="color" value="#64748b" style="height:46px;padding:4px">
        <label class="l">Aksè</label><div class="ak">${W.katalog.map((a) => `<label class="ck"><input type="checkbox" value="${a.kle}"> ${esk(a.non)}</label>`).join("")}</div>
        <p class="mute small">San okenn aksè: moun nan gen badj li ak espas li sèlman.</p>
        <div class="msg hidden"></div><div class="act2"><button class="btn">${w ? "Pwopoze chanjman an" : "Pwopoze wòl la"}</button></div>`;
      if (w) { f.n.value = w.non; f.d.value = w.deskripsyon || ""; f.k.value = w.koule; f.querySelectorAll(".ak input").forEach((i) => (i.checked = w.akse.includes(i.value))); }
      f.onsubmit = async (ev) => { ev.preventDefault(); const m = f.querySelector(".msg");
        try { const r = await SB.rpc("staf_wol_pwopoze", { p_code: KOD, p_aksyon: w ? "modifye" : "kreye", p_kle: w ? w.kle : null,
            p_done: { non: f.n.value, deskripsyon: f.d.value, koule: f.k.value, akse: [...f.querySelectorAll(".ak input:checked")].map((i) => i.value) } });
          alert(r.statut === "aplike" ? "Wòl la aplike ✓" : "Pwopozisyon an voye ✓ L ap aplike lè tout super admin yo valide l."); TAB = "wol"; afiche(); }
        catch (e) { m.className = "msg err"; m.textContent = e.message; } };
      return f;
    };
    v.append(el("h3", { textContent: "Wòl yo" }));
    W.wol.forEach((w) => {
      const d = el("div", { className: "card wl" });
      d.style.borderLeft = `8px solid ${w.koule}`;
      d.append(el("div", { className: "row2" }, el("h3", { style: "margin:0", textContent: w.non }), el("span", { className: "mute small", textContent: `${w.manm} manm` + (w.sistem ? " · fiks" : "") })));
      if (w.deskripsyon) d.append(el("p", { className: "mute", style: "margin:6px 0", textContent: w.deskripsyon }));
      d.append(el("div", { className: "chips" }, ...(w.akse.length ? w.akse.map((a) => el("span", { textContent: kat(a) })) : [el("span", { textContent: "Badj sèlman" })])));
      if (!w.sistem) {
        const zòn = el("div");
        d.append(el("div", { className: "act2" },
          bouton("Modifye", async () => { zòn.replaceChildren(fòm(w)); }, true),
          bouton("Retire", async () => { if (!confirm(`Pwopoze pou retire wòl « ${w.non} »?`)) return;
            const r = await SB.rpc("staf_wol_pwopoze", { p_code: KOD, p_aksyon: "efase", p_kle: w.kle, p_done: {} });
            alert(r.statut === "aplike" ? "Wòl la retire ✓" : "Pwopozisyon an voye ✓"); TAB = "wol"; afiche(); }, true)), zòn);
      }
      v.append(d);
    });
    v.append(fòm(null));
  }

  // ---- event, ticket types (prices, quotas, early-bird date)
  function vParam(v) {
    const e = D.evenement || {}, f = el("form", { className: "card" });
    const loc = (iso) => iso ? new Date(new Date(iso).getTime() - 5 * 3600e3).toISOString().slice(0, 16) : "";
    f.innerHTML = `<h3 style="margin-top:0">Evènman an</h3>
      <label class="l">Non</label><input name="nom"><label class="l">Dat ak lè (lè Ayiti)</label><input name="date" type="datetime-local">
      <label class="l">Kote</label><input name="lieu"><label class="l">Adrès</label><input name="adresse"><label class="l">Kapasite (plas an tout)</label><input name="capacite" type="number" min="1">
      <label class="l">Estati</label><select name="statut"><option value="ouvert">Louvri</option><option value="ferme">Fèmen</option></select>
      <h3>Tikè yo</h3><p class="mute small">Non · pri $ · pri goud · kota (kantite plas) · dènye dat vant (vid = pa gen limit). Pou rabè premye yo: yon tikè pi bon mache ak yon kota oswa yon dat. Pou retire yon tikè sou sit la: kite pri goud la vid. Tikè lève-bonè a disparèt pou kont li apre dat la.</p><div id="tps"></div>
      <button type="button" class="btn sm light" id="tp-plis">+ Yon tip tikè</button>
      <div class="msg hidden"></div><button class="btn full" style="margin-top:14px">Anrejistre</button>`;
    f.nom.value = e.nom || "Atelye konferans Atelye AI"; f.date.value = loc(e.date); f.lieu.value = e.lieu || ""; f.adresse.value = e.adresse || ""; f.capacite.value = e.capacite || 100; f.statut.value = e.statut || "ouvert";
    const tps = f.querySelector("#tps");
    const liy = (t = {}) => { const r = el("div", { className: "tp2" });
      r.innerHTML = `<input placeholder="Non" name="n"><input placeholder="$" name="u" inputmode="decimal"><input placeholder="Goud" name="h" inputmode="numeric"><input placeholder="Kota" name="q" inputmode="numeric"><input type="datetime-local" name="d">`;
      r.dataset.id = t.id || ""; r.querySelector("[name=n]").value = t.nom || ""; r.querySelector("[name=u]").value = t.prix_usd ?? ""; r.querySelector("[name=h]").value = t.prix_htg ?? ""; r.querySelector("[name=q]").value = t.quota ?? ""; r.querySelector("[name=d]").value = loc(t.date_fin_vente);
      tps.append(r); };
    (D.types.length ? D.types : [{ nom: "Lève-bonè" }, { nom: "Estanda" }]).forEach(liy);
    f.querySelector("#tp-plis").onclick = () => liy();
    const iso = (s) => s ? s + ":00-05:00" : "";
    f.onsubmit = async (ev) => { ev.preventDefault(); const m = f.querySelector(".msg"); m.className = "msg hidden";
      try {
        const types = [...tps.children].map((r, i) => ({ id: r.dataset.id, nom: r.querySelector("[name=n]").value.trim(), prix_usd: r.querySelector("[name=u]").value, prix_htg: r.querySelector("[name=h]").value, quota: Number(r.querySelector("[name=q]").value || 0), date_fin_vente: iso(r.querySelector("[name=d]").value), ordre: i})).filter((t) => t.nom);
        await SB.rpc("staf_evenement", { p_code: KOD, p_evenement: { id: e.id || "", nom: f.nom.value, date: iso(f.date.value), lieu: f.lieu.value, adresse: f.adresse.value, capacite: Number(f.capacite.value), statut: f.statut.value }, p_types: types });
        m.className = "msg ok"; m.textContent = "Anrejistre ✓"; await chaje(); TAB = "param";
      } catch (er) { m.className = "msg err"; m.textContent = er.message; } };
    v.append(f);
  }
})();
</script>
</body>
</html>
