<style>

      <label class="l">App secret</label><input name="app_secret" type="password" autocomplete="off" placeholder="${K.app_secret ? "•••• anrejistre (kite vid pou kenbe l)" : "32 karaktè"}">
      <h3>Konpòtman</h3>
      <label class="l">Enstriksyon an plis (ton, sa pou l di, sa pou l pa janm di)</label><textarea name="enstriksyon" rows="4" placeholder="Egz.: Toujou mansyone bonis Claude Pro a. Pa janm pale de ranbousman."></textarea>
      <label class="l">Mo ki fè l pase relè bay yon moun (separe ak vigil)</label><input name="mo_relais">
      <div class="msg hidden"></div><button class="btn full" style="margin-top:14px">Anrejistre</button>`;
    f.gemini_model.value = K.gemini_model || ""; f.wa_phone_id.value = K.wa_phone_id || ""; f.enstriksyon.value = K.enstriksyon || ""; f.mo_relais.value = K.mo_relais || "";
    f.onsubmit = async (ev) => { ev.preventDefault(); const m = f.querySelector(".msg"); m.className = "msg hidden";
      try { await SB.rpc("staf_wa_konfig_mete", { p_code: KOD, p: { gemini_kle: f.gemini_kle.value, gemini_model: f.gemini_model.value.trim(), wa_phone_id: f.wa_phone_id.value, wa_token: f.wa_token.value, app_secret: f.app_secret.value, enstriksyon: f.enstriksyon.value, mo_relais: f.mo_relais.value } });
        m.className = "msg ok"; m.textContent = "Anrejistre ✓"; setTimeout(() => afiche(), 900); } catch (e) { m.className = "msg err"; m.textContent = e.message; } };
    const res = el("div", { className: "mute small" });
    const kon = el("div", { className: "card", style: "padding:18px;margin-top:12px" }, el("h3", { style: "margin-top:0", textContent: "Konekte Meta" }),
      el("ol", { className: "gid" }, el("li", { textContent: "developers.facebook.com → app Atelye AI → WhatsApp → Configuration." }),
        el("li", { textContent: "Callback URL: kole adrès sa a:" }), kopi(hook),
        el("li", { textContent: "Verify token: kole kòd sa a:" }), kopi(K.verify_token),
        el("li", { textContent: "Webhook fields: koche « messages » (ak « smb_message_echoes » si w kenbe aplikasyon WhatsApp Business la)." })),
      el("div", { className: "act2" }, bouton("Teste koneksyon WhatsApp", async () => { const r = await waApi("tcheke");
        res.textContent = r.ok ? `✓ Konekte: ${r.non || ""} ${r.nimewo || ""}${r.kalite ? " · kalite " + r.kalite : ""}` : "✗ " + r.ere; }, true)), res);
    v.append(f, kon);
  }

  function vParam(v) {
    const e = D.evenement || {}, f = el("form", { className: "card" });
    const loc = (iso) => iso ? new Date(new Date(iso).getTime() - 5 * 3600e3).toISOString().slice(0, 16) : "";
    f.innerHTML = `<h3 style="margin-top:0">Evènman an</h3>
      <label class="l">Non</label><input name="nom"><label class="l">Dat ak lè (lè Ayiti)</label><input name="date" type="datetime-local">
      <label class="l">Kote</label><input name="lieu"><label class="l">Adrès</label><input name="adresse"><label class="l">Kapasite (plas an tout)</label><input name="capacite" type="number" min="1">
      <label class="l">Lyen gwoup WhatsApp (pou moun ki rezève)</label><input name="lyen_gwoup" type="url" placeholder="https://chat.whatsapp.com/…">
      <label class="l">Estati</label><select name="statut"><option value="ouvert">Louvri</option><option value="ferme">Fèmen</option></select>
      <h3>Tikè yo</h3><p class="mute small">Non · pri $ · pri goud · kota (kantite plas) · dènye dat vant (vid = pa gen limit). Pou rabè premye yo: yon tikè pi bon mache ak yon kota oswa yon dat. Pou retire yon tikè sou sit la: kite pri goud la vid. Tikè lève-bonè a disparèt pou kont li apre dat la.</p><div id="tps"></div>
      <button type="button" class="btn sm light" id="tp-plis">+ Yon tip tikè</button>
      <div class="msg hidden"></div><button class="btn full" style="margin-top:14px">Anrejistre</button>`;
    f.nom.value = e.nom || "Atelye konferans Atelye AI"; f.date.value = loc(e.date); f.lieu.value = e.lieu || ""; f.adresse.value = e.adresse || ""; f.capacite.value = e.capacite || 100; f.statut.value = e.statut || "ouvert"; f.lyen_gwoup.value = e.lyen_gwoup || "";
    const tps = f.querySelector("#tps");
    const liy = (t = {}) => { const r = el("div", { className: "tp2" });
      r.innerHTML = `<input placeholder="Non" name="n"><input placeholder="$" name="u" inputmode="decimal"><input placeholder="Goud" name="h" inputmode="numeric"><input placeholder="Kota" name="q" inputmode="numeric"><input type="datetime-local" name="d">`;
      r.dataset.id = t.id || ""; r.querySelector("[name=n]").value = t.nom || ""; r.querySelector("[name=u]").value = t.prix_usd ?? ""; r.querySelector("[name=h]").value = t.prix_htg ?? ""; r.querySelector("[name=q]").value = t.quota ?? ""; r.querySelector("[name=d]").value = loc(t.date_fin_vente);
      tps.append(r); };
    (D.types.length ? D.types : [{ nom: "Lève-bonè" }, { nom: "Estanda" }]).forEach(liy);
    f.querySelector("#tp-plis").onclick = () => liy();
    const iso = (s) => s ? s + ":00-05:00" : "";
    f.onsubmit = async (ev) => { ev.preventDefault(); const m = f.querySelector(".msg"); m.className = "msg hidden";
      try {
        const types = [...tps.children].map((r, i) => ({ id: r.dataset.id, nom: r.querySelector("[name=n]").value.trim(), prix_usd: r.querySelector("[name=u]").value, prix_htg: r.querySelector("[name=h]").value, quota: Number(r.querySelector("[name=q]").value || 0), date_fin_vente: iso(r.querySelector("[name=d]").value), ordre: i})).filter((t) => t.nom);
        await SB.rpc("staf_evenement", { p_code: KOD, p_evenement: { id: e.id || "", nom: f.nom.value, date: iso(f.date.value), lieu: f.lieu.value, adresse: f.adresse.value, capacite: Number(f.capacite.value), statut: f.statut.value, lyen_gwoup: f.lyen_gwoup.value }, p_types: types });
        m.className = "msg ok"; m.textContent = "Anrejistre ✓"; await chaje(); TAB = "param";
      } catch (er) { m.className = "msg err"; m.textContent = er.message; } };
    v.append(f);
  }
})();
</script>
