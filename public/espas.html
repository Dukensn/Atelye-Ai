<!doctype html>
<html lang="ht">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Espas elèv — Atelier AI</title>
<link rel="icon" href="/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top"><div class="wrap">
  <a href="/" aria-label="Atelier AI"><img src="/logo.png" alt="Atelier AI"></a>
  <nav><span class="mute small" id="salye"></span></nav>
</div></header>

<main class="wrap">
  <p id="chaje" class="mute" style="padding:48px 0">N ap chaje…</p>

  <div id="pa-bon" class="hidden" style="padding:48px 0;max-width:560px">
    <h2>Lyen sa a pa mache</h2>
    <p class="mute">Louvri lyen nou te voye ba ou sou WhatsApp la ankò. Si l toujou pa mache, ekri nou sou WhatsApp.</p>
  </div>

  <div id="espas" class="watch hidden">
    <div class="main">
      <div class="player" id="player"></div>
      <div class="meta">
        <h1 id="tit"></h1>
        <div class="chan">
          <div class="who">
            <div class="av"><img src="/icon.png" alt=""></div>
            <div><b>Atelier AI</b><span id="pozisyon"></span></div>
          </div>
        </div>
        <div class="chips" id="chips"></div>
        <div class="desc hidden" id="mesaj"><b>Mesaj</b><span></span></div>
      </div>
    </div>

    <aside class="side">
      <h2>Leson yo</h2>
      <div id="lis"></div>
      <div class="res">
        <h2>Resous</h2>
        <div id="resous"></div>
      </div>
    </aside>
  </div>
</main>

<script>
const $ = (s) => document.querySelector(s);
const el = (tag, props = {}, ...kids) => { const e = Object.assign(document.createElement(tag), props); e.append(...kids); return e; };
const svg = (d, fill) => { const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  s.setAttribute("width", "18"); s.setAttribute("height", "18"); s.setAttribute("viewBox", "0 0 24 24");
  s.setAttribute("fill", fill ? "currentColor" : "none"); s.setAttribute("stroke", fill ? "none" : "currentColor"); s.setAttribute("stroke-width", "2");
  s.innerHTML = d; return s; };
const IK = {
  play: '<path d="M8 5v14l11-7z"/>',
  chat: '<path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>',
  gift: '<rect x="3" y="8" width="18" height="13" rx="2"/><path d="M12 8v13M3 12h18"/>',
  box: '<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 012-2h4a2 2 0 012 2v2"/>',
  book: '<path d="M4 19.5A2.5 2.5 0 016.5 17H20V3H6.5A2.5 2.5 0 004 5.5z"/><path d="M4 19.5V21h16"/>',
};

const params = new URLSearchParams(location.search);
let kle = params.get("k");
try {
  if (kle) { localStorage.setItem("atelier-kle", kle); history.replaceState(null, "", "/espas" + location.hash); }
  else kle = localStorage.getItem("atelier-kle");
} catch {}

function youtubeId(u) {
  try {
    const x = new URL(u);
    if (x.hostname === "youtu.be") return x.pathname.slice(1);
    if (/youtube\.com$/.test(x.hostname.replace(/^www\.|^m\./, ""))) {
      if (x.searchParams.get("v")) return x.searchParams.get("v");
      const m = x.pathname.match(/^\/(?:embed|shorts|live)\/([\w-]+)/);
      if (m) return m[1];
    }
  } catch {}
  return null;
}

let videyo = [], aktif = 0;

function jwe(i) {
  aktif = i;
  const v = videyo[i], id = v.url && youtubeId(v.url);
  const p = $("#player"); p.replaceChildren();
  if (id) p.append(el("iframe", { src: `https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}?rel=0&modestbranding=1`, title: v.tit, allow: "encrypted-media; picture-in-picture; fullscreen", allowFullscreen: true }));
  else if (v.url) p.append(el("div", { className: "vid" }, el("a", { href: v.url, target: "_blank", rel: "noopener", textContent: "Gade videyo a ↗" })));
  else p.append(el("div", { className: "vid", textContent: "Videyo sa a ap vini byento." }));
  $("#tit").textContent = v.tit || `Leson ${i + 1}`;
  $("#pozisyon").textContent = `Leson ${i + 1} sou ${videyo.length}`;
  document.querySelectorAll(".item").forEach((b, j) => {
    b.setAttribute("aria-current", String(j === i));
    b.querySelector(".etat").textContent = j === i ? "Ap jwe kounye a" : `Leson ${j + 1}`;
    b.querySelector(".etat").classList.toggle("now", j === i);
  });
  history.replaceState(null, "", `#${i + 1}`);
}

function atik(v, i) {
  const id = v.url && youtubeId(v.url);
  const t = el("div", { className: "thumb" });
  if (id) t.append(el("img", { src: `https://i.ytimg.com/vi/${encodeURIComponent(id)}/mqdefault.jpg`, alt: "", loading: "lazy", onerror() { this.remove(); } }));
  else t.append(el("div", { className: "ph" }, svg(IK.play, true)));
  t.append(el("span", { className: "n", textContent: String(i + 1) }));
  const b = el("button", { className: "item", type: "button" }, t,
    el("div", {}, el("h3", { textContent: v.tit || `Leson ${i + 1}` }), el("span", { className: "etat" })));
  b.onclick = () => { jwe(i); window.scrollTo({ top: 0, behavior: "smooth" }); };
  return b;
}

const chip = (ic, tex, url, klas = "") => el("a", { className: "chip " + klas, href: url, target: "_blank", rel: "noopener" }, svg(ic), tex);
const res = (ic, tit, tex, url) => el("a", { className: "ritem", href: url, target: "_blank", rel: "noopener" },
  el("span", { className: "ic" }, svg(ic)), el("span", { className: "t" }, el("b", { textContent: tit }), el("span", { textContent: tex })));

async function chaje() {
  if (!kle) throw new Error();
  const r = await fetch("/api/espas", { headers: { "x-kle": kle } });
  if (!r.ok) throw new Error();
  const { non, kontni: k } = await r.json();
  $("#salye").textContent = `Bonjou ${non}`;
  videyo = k.videyo.length ? k.videyo : [{ tit: "Byento", url: "" }];
  $("#lis").append(...videyo.map(atik));

  const chips = [];
  if (k.lyen_kominote) chips.push(chip(IK.chat, "Kominote WhatsApp", k.lyen_kominote, "green"));
  if (k.lyen_claude) chips.push(chip(IK.gift, "7 jou Claude gratis", k.lyen_claude, "dark"));
  if (k.lyen_zouti) chips.push(chip(IK.box, "Zouti a", k.lyen_zouti));
  if (k.lyen_gid) chips.push(chip(IK.book, "Gid elèv la", k.lyen_gid));
  $("#chips").append(...chips);

  const rs = [];
  if (k.lyen_kominote) rs.push(res(IK.chat, "Kominote WhatsApp", "Enfòmasyon ak akonpayman", k.lyen_kominote));
  if (k.lyen_claude) rs.push(res(IK.gift, "7 jou Claude gratis", "Aktive l sèlman lè w pare: 7 jou yo kòmanse lamenm", k.lyen_claude));
  if (k.lyen_zouti) rs.push(res(IK.box, "Zouti Atelier AI", "Ouvè l sou GitHub epi peze Fork", k.lyen_zouti));
  if (k.lyen_gid) rs.push(res(IK.book, "Gid elèv la", "Tout etap yo ekri", k.lyen_gid));
  $("#resous").append(...rs);

  if (k.mesaj) { $("#mesaj span").textContent = k.mesaj; $("#mesaj").classList.remove("hidden"); }
  $("#espas").classList.remove("hidden");
  const h = parseInt(location.hash.slice(1), 10);
  jwe(h >= 1 && h <= videyo.length ? h - 1 : 0);
}

chaje().catch(() => $("#pa-bon").classList.remove("hidden")).finally(() => $("#chaje").classList.add("hidden"));
</script>
</body>
</html>
