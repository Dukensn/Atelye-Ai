<!doctype html>
<html lang="ht">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin — Atelier AI</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Atelier AI">
<link rel="icon" href="/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top"><div class="wrap">
  <a href="/" aria-label="Atelier AI"><img src="/logo.png" alt="Atelier AI"></a>
  <button class="btn light sm hidden" id="soti">Soti</button>
</div></header>

<main><section style="padding-top:24px"><div class="wrap">
  <form id="login" class="card">
    <h1 style="font-size:28px">Admin</h1>
    <label for="modpas">Modpas</label>
    <input id="modpas" type="password" autocomplete="current-password" required>
    <div id="login-ere" class="msg err hidden"></div>
    <button class="btn full" style="margin-top:16px">Antre</button>
  </form>

  <div id="panno" class="hidden">
    <div class="tabs" role="tablist">
      <button role="tab" data-t="atann" aria-selected="true">An atant <span id="c-atann"></span></button>
      <button role="tab" data-t="aksepte" aria-selected="false">Aksepte <span id="c-aksepte"></span></button>
      <button role="tab" data-t="san_prev" aria-selected="false">San prèv <span id="c-san_prev"></span></button>
      <button role="tab" data-t="refize" aria-selected="false">Refize</button>
      <button role="tab" data-t="afilye" aria-selected="false">Afilye</button>
      <button role="tab" data-t="retre" aria-selected="false">Retrè <span id="c-retre"></span></button>
      <button role="tab" data-t="kontni" aria-selected="false">Paramèt</button>
    </div>
    <div id="not" class="card hidden" style="border-color:var(--ink);margin-bottom:12px"></div>
    <div id="lis"></div>

    <form id="paramet" class="card hidden" style="margin-bottom:12px">
      <h2 style="font-size:20px">Pri ak komisyon</h2>
      <p class="mute small">Pri fòmasyon an parèt sou sit la lamenm. Komisyon an se sa yon elèv genyen chak fwa yon moun li envite peye epi w aksepte l.</p>
      <label>Pri fòmasyon an (goud)</label><input name="pri" type="number" inputmode="numeric" min="100">
      <label>Komisyon afilye (goud pa enskripsyon)</label><input name="komisyon" type="number" inputmode="numeric" min="0">
      <div id="p-msg" class="msg hidden"></div>
      <button class="btn full" style="margin-top:16px">Anrejistre</button>
    </form>

    <form id="kontni" class="card hidden">
      <h2 style="font-size:20px">Kontni espas elèv la</h2>
      <p class="mute small">Kole lyen yo isit la. Elèv yo wè chanjman yo lamenm.</p>
      <label>Tit videyo 1</label><input name="v0t">
      <label>Lyen videyo 1 (YouTube)</label><input name="v0u" type="url" placeholder="https://youtu.be/…">
      <label>Tit videyo 2</label><input name="v1t">
      <label>Lyen videyo 2 (YouTube)</label><input name="v1u" type="url" placeholder="https://youtu.be/…">
      <label>Lyen 7 jou Claude</label><input name="lyen_claude" type="url">
      <label>Lyen zouti a (GitHub)</label><input name="lyen_zouti" type="url">
      <label>Lyen gid la</label><input name="lyen_gid" type="url">
      <label>Lyen kominote WhatsApp la</label><input name="lyen_kominote" type="url" placeholder="https://chat.whatsapp.com/…">
      <label>Mesaj pou elèv yo <span class="mute">(si w vle)</span></label><textarea name="mesaj" rows="3"></textarea>
      <div id="k-msg" class="msg hidden"></div>
      <button class="btn full" style="margin-top:16px">Anrejistre</button>
    </form>
  </div>
</div></section></main>

<script>
const $ = (s) => document.querySelector(s);
const el = (tag, props = {}, ...kids) => { const e = Object.assign(document.createElement(tag), props); e.append(...kids); return e; };
let modpas = "", done = { lis: [], kontni: null, afilye: [], retre: [], paramet: {} }, tab = "atann";
const goud = (n) => `${Number(n).toLocaleString("fr-FR")} goud`;
try { modpas = sessionStorage.getItem("atelier-admin") || ""; } catch {}

async function api(method, body) {
  const r = await fetch("/api/admin", {
    method,
    headers: { "x-admin": modpas, ...(body ? { "content-type": "application/json" } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  const d = await r.json().catch(() => ({}));
  if (r.status === 401) { soti(); throw new Error(d.ere || "Modpas la pa bon."); }
  if (!r.ok) throw new Error(d.ere || "Gen yon pwoblèm.");
  return d;
}

function soti() {
  modpas = "";
  try { sessionStorage.removeItem("atelier-admin"); } catch {}
  $("#panno").classList.add("hidden"); $("#soti").classList.add("hidden"); $("#login").classList.remove("hidden");
}

const lè = (iso) => new Date(iso).toLocaleString("fr-HT", { dateStyle: "short", timeStyle: "short" });

function kat(e) {
  const kv = el("dl", { className: "kv" });
  const ajoute = (k, v) => v && kv.append(el("dt", { textContent: k }), el("dd", { textContent: v }));
  ajoute("WhatsApp", e.telefon); ajoute("Enskri", lè(e.kreye));
  if (e.prev_le) ajoute("Prèv voye", lè(e.prev_le));
  if (e.parenn) ajoute("Envite pa", e.parenn + (e.komisyon ? ` (+${goud(e.komisyon)})` : ""));
  if (e.kod) ajoute("Kòd afilye", e.kod);
  const aksyon = el("div", { className: "actions" });
  const k = el("div", { className: "card" },
    el("div", { className: "row" }, el("h3", { textContent: e.non, style: "margin:0" }), el("span", { className: "badge " + e.estati, textContent: { atann: "An atant", aksepte: "Aksepte", refize: "Refize", san_prev: "San prèv" }[e.estati] })),
    kv, aksyon);

  const bouton = (tèks, klas, fn) => { const b = el("button", { className: "btn sm " + klas, textContent: tèks }); b.onclick = () => fn(b); return b; };
  const fè = (aks) => async (b) => {
    if (aks === "refize" && !confirm(`Refize ${e.non}? Si l te gen aksè, l ap pèdi l.`)) return;
    b.disabled = true;
    try {
      const d = await api("POST", { aksyon: aks, id: e.id });
      await rechaje();
      if (aks === "aksepte") montreNot(e, d);
    } catch (err) { alert(err.message); b.disabled = false; }
  };

  if (e.foto) {
    const img = el("img", { className: "hidden", alt: "Prèv peman", style: "margin-top:10px;max-height:420px;width:auto;border-radius:8px" });
    k.insertBefore(img, aksyon);
    aksyon.append(bouton("Wè prèv la", "light", async (b) => {
      if (img.src) { img.classList.toggle("hidden"); return; }
      b.disabled = true;
      try {
        const r = await fetch(`/api/prev?id=${encodeURIComponent(e.id)}`, { headers: { "x-admin": modpas } });
        if (!r.ok) throw new Error("Pa jwenn foto a.");
        img.src = URL.createObjectURL(await r.blob()); img.classList.remove("hidden");
      } catch (err) { alert(err.message); }
      b.disabled = false;
    }));
  }
  if (e.estati === "atann") {
    aksyon.append(bouton("✓ Peman an rive — Aksepte", "", fè("aksepte")), bouton("Refize", "light", fè("refize")));
  } else if (e.estati === "san_prev") {
    const wa = `https://wa.me/${e.telefon.replace(/\D/g, "").replace(/^(\d{8})$/, "509$1")}?text=${encodeURIComponent(`Bonjou ${e.non.split(" ")[0]}! Ou te kòmanse enskripsyon w pou Atelier AI. Pa bliye voye foto prèv peman an pou n ka ba w aksè.`)}`;
    aksyon.append(el("a", { className: "btn sm wa", href: wa, target: "_blank", rel: "noopener", textContent: "Raple l sou WhatsApp" }), bouton("Aksepte kanmenm", "light", fè("aksepte")));
  } else if (e.estati === "aksepte") {
    aksyon.append(
      el("a", { className: "btn sm wa", href: e.whatsapp, target: "_blank", rel: "noopener", textContent: "Voye lyen an sou WhatsApp" }),
      bouton("Kopye lyen an", "light", async (b) => { try { await navigator.clipboard.writeText(e.lyen); b.textContent = "Kopye ✓"; } catch { prompt("Kopye lyen an:", e.lyen); } }),
      bouton("Retire aksè", "light", fè("refize")),
    );
  } else {
    aksyon.append(bouton("Aksepte kanmenm", "light", fè("aksepte")));
  }
  return k;
}

function montreNot(e, d) {
  const n = $("#not"); n.replaceChildren();
  n.append(el("h3", { textContent: `✓ ${e.non} aksepte` }));
  const a = el("div", { className: "actions" });
  if (d.whatsapp) a.append(el("a", { className: "btn sm wa", href: d.whatsapp, target: "_blank", rel: "noopener", textContent: `Voye lyen an bay ${e.non.split(" ")[0]}` }));
  if (d.parenn) a.append(el("a", { className: "btn sm", href: d.parenn.whatsapp, target: "_blank", rel: "noopener", textContent: `Avèti ${d.parenn.non.split(" ")[0]}: +${goud(d.parenn.montan)}` }));
  const f = el("button", { className: "btn sm light", textContent: "Fèmen" }); f.onclick = () => n.classList.add("hidden");
  a.append(f); n.append(a); n.classList.remove("hidden"); window.scrollTo(0, 0);
}

function katAfilye(a) {
  const kv = el("dl", { className: "kv" });
  const ajoute = (k, v) => kv.append(el("dt", { textContent: k }), el("dd", { textContent: v }));
  ajoute("WhatsApp", a.telefon); ajoute("Kòd", a.kod);
  ajoute("Envite", `${a.filye} (${a.aksepte} aksepte)`);
  ajoute("Genyen", goud(a.gen)); ajoute("Deja peye", goud(a.peye));
  if (a.atann) ajoute("Demann an atant", goud(a.atann));
  ajoute("Balans", goud(a.balans));
  return el("div", { className: "card" }, el("div", { className: "row" }, el("h3", { textContent: a.non, style: "margin:0" }), el("span", { className: "badge aksepte", textContent: goud(a.gen) })), kv);
}

function katRetre(r) {
  const kv = el("dl", { className: "kv" });
  const ajoute = (k, v) => kv.append(el("dt", { textContent: k }), el("dd", { textContent: v }));
  ajoute("Montan", goud(r.montan)); ajoute("Sou", `${r.metod === "moncash" ? "MonCash" : "NatCash"} · ${r.nimewo}`);
  ajoute("WhatsApp", r.telefon); ajoute("Dat", lè(r.kreye));
  const a = el("div", { className: "actions" });
  const bt = (t, k, aks) => { const b = el("button", { className: "btn sm " + k, textContent: t }); b.onclick = async () => {
    if (aks === "retre_anile" && !confirm("Anile demann sa a? Kòb la ap retounen nan balans elèv la.")) return;
    b.disabled = true;
    try { const d = await api("POST", { aksyon: aks, id: r.id }); await rechaje(); if (d.whatsapp) { const n = $("#not"); n.replaceChildren(el("h3", { textContent: `✓ ${goud(r.montan)} make peye` }), el("div", { className: "actions" }, el("a", { className: "btn sm wa", href: d.whatsapp, target: "_blank", rel: "noopener", textContent: `Di ${r.non.split(" ")[0]} kòb la voye` }))); n.classList.remove("hidden"); window.scrollTo(0, 0); } }
    catch (err) { alert(err.message); b.disabled = false; } }; return b; };
  if (r.estati === "atann") a.append(bt(`✓ Mwen peye ${goud(r.montan)}`, "", "retre_peye"), bt("Anile", "light", "retre_anile"));
  const badge = { atann: ["atann", "An atant"], peye: ["aksepte", "Peye"], anile: ["refize", "Anile"] }[r.estati];
  return el("div", { className: "card" }, el("div", { className: "row" }, el("h3", { textContent: r.non, style: "margin:0" }), el("span", { className: "badge " + badge[0], textContent: badge[1] })), kv, a);
}

function afiche() {
  document.querySelectorAll(".tabs button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.t === tab)));
  const n = (s) => done.lis.filter((e) => e.estati === s).length;
  $("#c-atann").textContent = `(${n("atann")})`; $("#c-aksepte").textContent = `(${n("aksepte")})`; $("#c-san_prev").textContent = `(${n("san_prev")})`;
  $("#c-retre").textContent = `(${done.retre.filter((r) => r.estati === "atann").length})`;
  $("#kontni").classList.toggle("hidden", tab !== "kontni");
  $("#paramet").classList.toggle("hidden", tab !== "kontni");
  const lis = $("#lis"); lis.replaceChildren();
  if (tab === "kontni") return;
  if (tab === "afilye") {
    const tot = done.afilye.reduce((s, a) => s + a.gen, 0);
    lis.append(el("p", { className: "mute", textContent: done.afilye.length ? `${done.afilye.length} afilye · ${goud(tot)} komisyon an tout` : "Pa gen afilye ankò." }), ...done.afilye.map(katAfilye));
    return;
  }
  if (tab === "retre") {
    lis.append(...(done.retre.length ? done.retre.map(katRetre) : [el("p", { className: "mute", textContent: "Pa gen demann retrè ankò." })]));
    return;
  }
  const sa = done.lis.filter((e) => e.estati === tab);
  if (!sa.length) lis.append(el("p", { className: "mute", textContent: "Pa gen anyen la a pou kounye a." }));
  else lis.append(...sa.map(kat));
}

function ranpliKontni(k) {
  const f = $("#kontni");
  f.v0t.value = k.videyo[0]?.tit || ""; f.v0u.value = k.videyo[0]?.url || "";
  f.v1t.value = k.videyo[1]?.tit || ""; f.v1u.value = k.videyo[1]?.url || "";
  f.lyen_claude.value = k.lyen_claude; f.lyen_zouti.value = k.lyen_zouti; f.lyen_gid.value = k.lyen_gid; f.lyen_kominote.value = k.lyen_kominote || ""; f.mesaj.value = k.mesaj;
}

async function rechaje() {
  done = await api("GET");
  ranpliKontni(done.kontni);
  $("#paramet").pri.value = done.paramet.pri; $("#paramet").komisyon.value = done.paramet.komisyon;
  afiche();
}

$("#login").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  modpas = $("#modpas").value;
  $("#login-ere").classList.add("hidden");
  try {
    await rechaje();
    try { sessionStorage.setItem("atelier-admin", modpas); } catch {}
    $("#login").classList.add("hidden"); $("#panno").classList.remove("hidden"); $("#soti").classList.remove("hidden");
  } catch (e) { $("#login-ere").textContent = e.message; $("#login-ere").classList.remove("hidden"); }
});

$("#soti").addEventListener("click", soti);
document.querySelectorAll(".tabs button").forEach((b) => b.addEventListener("click", () => { tab = b.dataset.t; afiche(); }));

$("#kontni").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const f = ev.target, m = $("#k-msg");
  const kontni = {
    videyo: [{ tit: f.v0t.value, url: f.v0u.value }, { tit: f.v1t.value, url: f.v1u.value }],
    lyen_claude: f.lyen_claude.value, lyen_zouti: f.lyen_zouti.value, lyen_gid: f.lyen_gid.value, lyen_kominote: f.lyen_kominote.value, mesaj: f.mesaj.value,
  };
  try { await api("POST", { aksyon: "kontni", kontni }); m.className = "msg ok"; m.textContent = "Anrejistre ✓"; }
  catch (e) { m.className = "msg err"; m.textContent = e.message; }
});

$("#paramet").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const f = ev.target, m = $("#p-msg");
  try { await api("POST", { aksyon: "paramet", pri: f.pri.value, komisyon: f.komisyon.value }); m.className = "msg ok"; m.textContent = "Anrejistre ✓"; await rechaje(); }
  catch (e) { m.className = "msg err"; m.textContent = e.message; }
});

if (modpas) rechaje().then(() => {
  $("#login").classList.add("hidden"); $("#panno").classList.remove("hidden"); $("#soti").classList.remove("hidden");
}).catch(() => {});
</script>
</body>
</html>
