# Keeps the free Supabase project awake: Supabase pauses a free project after 7 days without activity.
# Every 2 days, a real read goes through the database (the public event info, the same call the site makes).
name: Supabase reveye

on:
  schedule:
    - cron: "17 13 */2 * *"   # every 2 days, 13:17 UTC (9:17 in Haiti)
  workflow_dispatch: {}        # "Run workflow" button, to test by hand

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SB_URL: https://mfxyzjelxpziptlshkfv.supabase.co
      SB_KLE: sb_publishable_b1ed3iovvTdxVm0fyZ4FBw_PN8CrRlS   # public key, already in the site's pages
    steps:
      - name: Ping the database
        run: |
          for i in 1 2 3; do
            code=$(curl -sS -o body.json -w '%{http_code}' -X POST "$SB_URL/rest/v1/rpc/evenement_public" \
              -H "apikey: $SB_KLE" -H "content-type: application/json" -d '{}') || code=000
            echo "Attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Database awake ✓ — event: $(grep -o '"nom":"[^"]*"' body.json | head -1)"
              exit 0
            fi
            sleep 20
          done
          echo "::error::Supabase did not answer (HTTP $code). Open the Supabase dashboard: the project may be paused."
          cat body.json || true
          exit 1
