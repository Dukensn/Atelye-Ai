[build]
  publish = "public"
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/espas*"
  [headers.values]
    X-Robots-Tag = "noindex"
[[headers]]
  for = "/admin*"
  [headers.values]
    X-Robots-Tag = "noindex"
