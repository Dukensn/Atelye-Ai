 <path d="M430 150 a40 40 0 0 1 40 40 c0 34 -40 70 -40 70 s-40 -36 -40 -70 a40 40 0 0 1 40 -40z" fill="#d7ff3a"/><circle cx="430" cy="190" r="14" fill="#0f0f0f"/>
</svg></div>

<script>
// 100 seats: 10x10 grid, 88 taken (yellow), 12 still free (white rings, last one glowing lime)
const s = document.getElementById("plas-svg"); let h = "";
for (let i = 0; i < 100; i++) { const x = 340 + (i % 10) * 62, y = 80 + Math.floor(i / 10) * 62; const free = i >= 88;
  h += free ? `<circle cx="${x}" cy="${y}" r="20" fill="none" stroke="${i === 88 ? '#d7ff3a' : '#fff'}" stroke-width="${i === 88 ? 7 : 4}"/>` : `<circle cx="${x}" cy="${y}" r="22" fill="#ffc83d"/>`; }
s.innerHTML = h;
</script>
